  var titleEditable = editable && !isGrouped; // 그룹이 있는 덱은 제목이 자동 생성이라 직접 못 고침
  var titleBar = '<div class="title-bar">' +
    (editable
      ? '<div class="title-boss editable" data-edit-boss title="클릭해서 보스 이미지 URL을 직접 지정 (비워두면 요일 기본 이미지 사용)">' + bossImg + '</div>'
      : (effectiveBossIcon ? '<div class="title-boss">' + bossImg + '</div>' : '')) +
    '<div class="title-text">' +
    (titleEditable ? '<h1 class="editable-text" contenteditable="true" data-field="title">' + esc(deck.title) + '</h1>' : '<h1>' + esc(deck.title) + '</h1>') +
    (editable
      ? '<span class="note-tag editable-text" contenteditable="true" data-field="noteTag" data-placeholder="태그(선택)">' + esc(deck.noteTag) + '</span>'
      : (deck.noteTag ? '<span class="note-tag">' + esc(deck.noteTag) + '</span>' : '')) +
    '</div></div>';

  var addCharRow = editable ? '<div class="add-row"><button type="button" class="add-btn" data-add-char>+ 캐릭터 추가</button></div>' : '';

  return '<div class="deck' + (editable ? ' editing' : '') + '">' + orderSelectHtml + titleBar +
    '<div class="row charset" style="grid-template-columns:repeat(' + chars.length + ',1fr)">' + charSetsHtml + '</div>' +
    addCharRow +
    '<div class="row pets">' + petsHtml + positionBoxHtml + '</div>' +
    timelineHtml +
    '</div>';
}

// state.equip[kind]는 "공용/기사/법사/힐러/사수/미분류" 구분줄이 섞인 전체 목록이다.
// 캐릭터의 직업(role)이 있으면 "공용" + 그 직업 칸 항목만 골라서 드롭다운에 보여준다.
// (아직 "목록 관리"에서 분류를 안 해서 구분줄이 아예 없거나, 직업 정보가 없거나, 필터링했더니
// 하나도 안 걸리면 — 실수로 목록이 텅 비어버리는 걸 막기 위해 — 안전하게 전체 목록을 그대로 보여준다.)
// 지금 이미 장착돼 있는 장비가 필터링 결과에 없으면(직업이 바뀌었거나 분류가 나중에 바뀐 경우)
// 그래도 선택된 상태로는 보이도록 목록 맨 뒤에 끼워 넣는다.
function equipOptionsForRole_(kind, role, currentName) {
  var list = state.equip[kind] || [];
  var hasDividers = list.some(function (e) { return e.divider; });
  var filtered = list;
  if (hasDividers && role) {
    var current = null;
    var out = [];
    list.forEach(function (e) {
      if (e.divider) { current = e.label; return; }
      if (current === '공용' || current === role) out.push(e);
    });
    if (out.length) filtered = out;
  }
  if (currentName && !filtered.some(function (e) { return !e.divider && e.name === currentName; })) {
    var found = list.find(function (e) { return !e.divider && e.name === currentName; });
    if (found) filtered = filtered.concat([found]);
  }
  return filtered;
}

function gearCell_(g, idx, kind, editable, role) {
  var name = (g && g.name) || '';
  // 덱에 저장된 아이콘도 오래된 스냅샷일 수 있어서, 라이브러리에 같은 이름이 있으면 최신 URL을 우선 쓴다.
  var icon = liveEquipIcon_(kind, name, (g && g.icon) || '');
  var options = equipOptionsForRole_(kind, role, name);
  var overlay = editable ? '<select class="tile-overlay" data-edit-gear="' + idx + ':' + kind + '">' + optionsHtml_(options, name) + '</select>' : '';
  return '<div class="gear-cell' + (editable ? ' editable' : '') + '"><img src="' + esc(icon) + '" title="' + esc(name) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)">' + overlay + '</div>';
}

/* =========================================================
   관리자 편집 폼
========================================================= */
function blankCharSlot_(col, slot) {
  return { col: col, slot: slot, name: '', portrait: '', weapon: {}, armor: {}, item: {}, rune: {}, card: {} };
}

// 새 덱을 만들 때 스킬 타임라인 기본 틀을 미리 깔아준다. 대부분은 "5스탭 x 2사이클"이 기본이라
// 매번 사이클 추가 + 스텝 추가(5번)를 두 번 반복하는 번거로움을 줄인다.
// 예외: 대난투(어느 그룹이든)와 아발론 "성문" 타입은 원래 1사이클(5스탭)이 기본이다.
function defaultTimelineCycles_(category, group) {
  var oneCycleOnly = category === '대난투' || /성문$/.test(group || '');
  var numCycles = oneCycleOnly ? 1 : 2;
  var cycles = [];
  for (var i = 0; i < numCycles; i++) {
    var steps = [];
    for (var j = 0; j < 5; j++) steps.push({ name: '', img: '', tag: '', memo: '' });
    cycles.push({ label: (i + 1) + '사이클', steps: steps });
  }
  return cycles;
}

function newDeck() {
  var id = 'deck_' + Date.now();
  var blank = {
    // 새 덱은 항상 같은 그룹 안에서 1번째로 온다 — 이미 있는 다른 덱들을 안 건드려도,
    // 걔들은 "순서 미지정"(맨 뒤로 취급)이라 order:1을 주면 자동으로 맨 앞에 온다.
    id: id, title: '새 덱', category: state.category, group: state.group || '', order: 1, noteTag: '', bossIcon: '',
    // 대부분의 덱은 5명(후열1 · 중열2 · 전열2) 구성이라 기본으로 5칸을 미리 만들어 둔다.
    // 필요하면 "+ 캐릭터 추가"로 더 넣거나, 빈 칸을 그대로 두면 저장 시 제외된다.
    characters: [
      blankCharSlot_('후열', 1),
      blankCharSlot_('중열', 1),
      blankCharSlot_('중열', 2),
      blankCharSlot_('전열', 1),
      blankCharSlot_('전열', 2)
    ],
    pets: [], timeline: { cycles: defaultTimelineCycles_(state.category, state.group) }, warnings: []
  };
  state.currentId = id;
  state.currentDeck = blank;
  // 예전엔 여기서 state.decks에도 바로 추가해서 드롭다운 목록에 즉시 나타났는데, 그러면 "저장"을
  // 누르지 않고 다른 덱으로 넘어가버릴 경우 목록에는 남아있지만 실제로는 서버에 없는(=저장 안 된)
  // 덱이 생겨서, 다시 눌러도 불러오기가 안 되고 삭제 버튼도 뜰 방법이 없는 "유령 덱" 문제가 있었다.
  // 그래서 이제는 실제로 "저장"을 눌러 서버에 반영될 때만 목록에 추가한다(saveDeck_ui 참고).
  // 목록엔 아직 안 뜨지만, 지금 만들고 있는 새 덱이라는 걸 알 수 있게 드롭다운엔 임시 표시만 해준다.
  renderDeckList();
  document.getElementById('viewer').innerHTML =
    '<div class="deck"><div class="loading-msg"><span class="spinner"></span>불러오는 중입니다...</div></div>';
  loadLibraries().then(renderCurrentDeck);
}

/* =========================================================
   자유 덱 — 관리자 권한 없이 길드원 누구나 만들고 고칠 수 있는 별도 공간.
   레이드/아발론/대난투처럼 카테고리→그룹→번호로 이어지는 3단 드롭다운에 섞이지 않고,
   완전히 별도의 화면(이름만 쭉 나열된 목록)에서 다룬다.
========================================================= */
function onFreeBtn() {
  state.mode = state.mode === 'free' ? 'normal' : 'free';
  var btn = document.getElementById('free-btn');
  btn.textContent = state.mode === 'free' ? '자유 덱 ON' : '자유 덱';
  btn.classList.toggle('admin-on', state.mode === 'free');
  document.getElementById('menu-row-normal').style.display = state.mode === 'free' ? 'none' : 'flex';
  document.getElementById('free-menu-row').style.display = state.mode === 'free' ? 'flex' : 'none';
  state.currentId = null;
  state.currentDeck = null;
  if (state.mode === 'free') {
    renderFreeDeckSelect_();
  } else {
    renderDeckList();
  }
  renderCurrentDeck();
}

function freeDecksSorted_() {
  return state.decks.filter(isFreeDeck_);
}

function renderFreeDeckSelect_() {
  var sel = document.getElementById('sel-free-deck');
  var freeDecks = freeDecksSorted_();
  var isDraft = state.currentId && !freeDecks.some(function (d) { return d.id === state.currentId; }) &&
    state.currentDeck && isFreeDeck_(state.currentDeck);
  var options = '<option value="" disabled' + (state.currentId ? '' : ' selected') + '>자유 덱 선택 (' + freeDecks.length + '/' + FREE_DECK_LIMIT + '개)</option>' +
    freeDecks.map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === state.currentId ? ' selected' : '') + '>' + esc(d.title) + '</option>';
    }).join('');
  if (isDraft) {
    options += '<option value="' + esc(state.currentId) + '" selected>' + esc(state.currentDeck.title || '새 자유 덱') + ' (저장 전)</option>';
  }
  options += '<option value="__newfree__">+ 새 자유 덱 만들기</option>';
  sel.innerHTML = options;
}

function onFreeDeckSelectChange_(id) {
  if (id === '__newfree__') { newFreeDeck(); return; }
  if (!id) return;
  selectDeck(id);
}

function newFreeDeck() {
  if (freeDecksSorted_().length >= FREE_DECK_LIMIT) {
    alert('자유 덱은 최대 ' + FREE_DECK_LIMIT + '개까지만 만들 수 있어요. 안 쓰는 덱을 지우고 다시 시도해주세요.');
    renderFreeDeckSelect_();
    return;
  }
  var title = prompt('자유 덱 이름을 입력하세요');
  if (title === null) { renderFreeDeckSelect_(); return; }
  title = title.trim();
  if (!title) { alert('이름을 입력해주세요.'); return newFreeDeck(); }
  var pin = prompt('이 덱을 나중에 고치거나 지울 때 필요한 4자리 번호를 정해주세요.\n비워두면 다른 길드원도 이 덱을 자유롭게 고치거나 지울 수 있어요.', '');
  if (pin === null) { renderFreeDeckSelect_(); return; }
  pin = pin.trim();
  if (pin && !/^\d{4}$/.test(pin)) {
    alert('번호는 숫자 4자리로 입력해주세요.');
    return newFreeDeck();
  }
  if (!pin && !confirm('번호를 정하지 않으면 다른 길드원도 이 덱을 고치거나 지울 수 있어요. 이대로 진행할까요?')) {
    return newFreeDeck();
  }
  var id = 'free_' + Date.now();
  var blank = {
    id: id, title: title, category: FREE_CATEGORY, group: '', order: '', noteTag: '', bossIcon: '', pin: pin,
    characters: [
      blankCharSlot_('후열', 1),
      blankCharSlot_('중열', 1),
      blankCharSlot_('중열', 2),
      blankCharSlot_('전열', 1),
      blankCharSlot_('전열', 2)
    ],
    pets: [], timeline: { cycles: defaultTimelineCycles_('', '') }, warnings: []
  };
  state.currentId = id;
  state.currentDeck = blank;
  renderFreeDeckSelect_();
  document.getElementById('viewer').innerHTML =
    '<div class="deck"><div class="loading-msg"><span class="spinner"></span>불러오는 중입니다...</div></div>';
  loadLibraries().then(renderCurrentDeck);
}

function wireFreeBar_(deck) {
  document.getElementById('admin-save-btn').onclick = function () { saveFreeDeck_ui(deck); };
  document.getElementById('admin-delete-btn').onclick = function () {
    if (isDraftDeck_()) {
      if (!confirm('저장하지 않은 새 자유 덱을 취소할까요?')) return;
      discardDraftDeck_();
      return;
    }
    // 관리자는 번호를 몰라도 그냥 지울 수 있게, 기존 관리자용 삭제 통로를 그대로 쓴다.
    if (state.isAdmin) { deleteDeck_ui(deck.id); return; }
    deleteFreeDeck_ui(deck.id);
  };
  document.getElementById('admin-revert-btn').onclick = function () {
    if (isDraftDeck_()) {
      if (!confirm('저장하지 않은 새 자유 덱을 취소할까요?')) return;
      discardDraftDeck_();
      return;
    }
    if (!confirm('저장하지 않은 수정 내용을 취소하고 마지막 저장 상태로 되돌릴까요?')) return;
    if (state.currentId) selectDeck(state.currentId);
  };
}

// pinOverride가 있으면 그 값으로 시도(서버가 "핀이 틀렸다"고 해서 다시 물어본 경우), 없으면
// 이번 화면(새로고침 전까지)에서 이미 맞다고 확인된 핀이 있으면 그걸 자동으로 같이 보낸다.
function saveFreeDeck_ui(d, pinOverride) {
  var msg = document.getElementById('save-msg');
  var btn = document.getElementById('admin-save-btn');
  if (btn) btn.disabled = true;
  msg.textContent = '저장 중...';
  msg.className = 'msg';
  var payload = Object.assign({}, d, {
    category: FREE_CATEGORY, group: '',
    characters: (d.characters || []).filter(function (c) { return c.name; })
  });
  var pinToSend = pinOverride !== undefined ? pinOverride : (state.freeEditPins[d.id] || '');
  api('saveFree', {}, 'POST', { pw: state.viewPw, deck: payload, pin: pinToSend }).then(function (res) {
    if (btn) btn.disabled = false;
    if (res.ok) {
      // 방금 처음 만든 덱이면 d.pin에 조금 전 정한 핀이 들어있으니 그걸 기억해두고(그래야 바로
      // 다음 수정부터 또 안 물어봄), 기존 덱을 고친 거면 이번에 맞았던 핀(pinToSend)을 그대로 기억한다.
      state.freeEditPins[d.id] = d.pin || pinToSend;
      msg.textContent = '저장되었습니다.';
      msg.className = 'msg ok';
      if (state.currentId === d.id) state.currentDeck = d;
      var found = state.decks.find(function (x) { return x.id === d.id; });
      if (found) { found.title = d.title; found.category = FREE_CATEGORY; found.group = ''; found.tag = d.noteTag || ''; }
      else state.decks.push({ id: d.id, title: d.title, category: FREE_CATEGORY, group: '', order: '', tag: d.noteTag || '' });
      renderFreeDeckSelect_();
    } else if (res.error === 'WRONG_PIN') {
      msg.textContent = '';
      msg.className = 'msg';
      var entered = prompt('이 덱은 번호로 보호돼 있어요. 수정하려면 만들 때 정한 4자리 번호를 입력하세요.', '');
      if (entered === null) return;
      saveFreeDeck_ui(d, entered.trim());
    } else if (res.error === 'FREE_DECK_LIMIT') {
      msg.textContent = '저장 실패: 자유 덱은 최대 ' + FREE_DECK_LIMIT + '개까지만 만들 수 있어요.';
      msg.className = 'msg err';
    } else {
      msg.textContent = '저장 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  }).catch(function () {
    if (btn) btn.disabled = false;
    msg.textContent = '저장 중 통신 오류가 발생했습니다. 다시 시도해주세요.';
    msg.className = 'msg err';
  });
}

// pinOverride가 있으면 그 값으로 재시도. 없으면 이번 화면에서 이미 확인된 핀이 있는 경우
// 다시 안 물어보고 그걸 그대로 쓰고(수정할 때 이미 한 번 맞혀본 핀이면 삭제할 때도 또 물어볼
// 필요 없음), 없을 때만 새로 물어본다.
function deleteFreeDeck_ui(id, pinOverride) {
  if (pinOverride === undefined && !confirm('이 자유 덱을 삭제할까요? 되돌릴 수 없습니다.')) return;
  var pin;
  if (pinOverride !== undefined) {
    pin = pinOverride;
  } else if (Object.prototype.hasOwnProperty.call(state.freeEditPins, id)) {
    pin = state.freeEditPins[id];
  } else {
    pin = (prompt('이 덱을 만들 때 정한 4자리 번호가 있다면 입력하세요. (없으면 그냥 확인만 눌러주세요)', '') || '').trim();
  }
  var msg = document.getElementById('save-msg');
  if (msg) { msg.textContent = '삭제 중...'; msg.className = 'msg'; }
  api('deleteFree', {}, 'POST', { pw: state.viewPw, id: id, pin: pin }).then(function (res) {
    if (res.ok) {
      delete state.freeEditPins[id];
      state.decks = state.decks.filter(function (x) { return x.id !== id; });
      state.currentId = null;
      state.currentDeck = null;
      renderFreeDeckSelect_();
      renderCurrentDeck();
    } else if (res.error === 'WRONG_PIN') {
      if (msg) { msg.textContent = ''; msg.className = 'msg'; }
      var entered = prompt('번호가 맞지 않아요. 이 덱을 만들 때 정한 4자리 번호를 다시 입력해주세요. (모르면 관리자에게 관리자 모드로 삭제해달라고 요청하세요)', '');
      if (entered === null) return;
      deleteFreeDeck_ui(id, entered.trim());
    } else {
      if (msg) { msg.textContent = '삭제 실패: ' + (res.error || ''); msg.className = 'msg err'; }
    }
  }).catch(function () {
    if (msg) { msg.textContent = '삭제 중 통신 오류가 발생했습니다.'; msg.className = 'msg err'; }
  });
}

// force=true는 "방금 라이브러리를 추가/수정했으니 캐시 무시하고 반드시 새로 받아와야 한다"는
// 뜻이다(submitAddItem/saveLibraryList_ 등). force가 아니면 이미 불러왔거나(길이>0) 이미 요청이
// 진행 중이면 그대로 재사용하는데, force일 때 만약 다른 요청이 마침 진행 중이었다면 그 "예전" 요청
// 결과로 방금 반영한 최신 상태를 덮어써버릴 수 있는 아주 드문 경우가 있어서, force일 땐 그 진행 중인
// 요청을 재사용하지 않고 새 요청을 보낸다.
function loadLibraries(force) {
  if (!force && state.characters.length) return Promise.resolve();
  // 이미 요청이 진행 중이면(로그인 직후에 미리 불러오기 시작한 게 아직 안 끝났는데 덱을 클릭한 경우 등)
  // 새로 또 요청을 보내지 않고 그 Promise를 그대로 돌려준다.
  // (이걸 안 하면 bootstrap이 동시에 2번 나가고, Apps Script는 같은 스크립트로 오는 요청을 동시에
  //  처리 못 해서 두 요청이 서로 줄을 서서 기다리다가 오히려 예전 5개 요청보다 더 느려지는 문제가 있었다.)
  if (!force && state.librariesPromise) return state.librariesPromise;
  // 예전에는 characters/pets/cards/icons/equip을 5개의 별도 요청으로 나눠서 불러왔는데,
  // Apps Script 웹앱은 같은 스크립트로 오는 요청을 동시에 처리하지 못하고 줄을 서서 처리하기 때문에
  // 5개를 "동시에" 보내도 실제로는 순서대로 처리되어 체감 속도가 5배 가까이 느려지는 문제가 있었다.
  // 서버에 새로 만든 bootstrap 액션 하나로 5개를 한 번에 받아온다(요청 1번으로 끝).
  state.librariesPromise = api('bootstrap', { pw: state.viewPw }).then(function (r) {
    state.librariesPromise = null;
    if (!r.ok) return;
    state.characters = r.characters || [];
    state.pets = r.pets || [];
    state.cards = r.cards || [];
    state.equip = r.equip || { weapon: [], armor: [], item: [], rune: [] };
    state.jobGear = r.jobGear || {};
  }, function (err) {
    state.librariesPromise = null;
    throw err;
  });
  return state.librariesPromise;
}

// 캐릭터/펫/카드/장비 이름으로 찾는 함수들이 인라인 수정(wireAdminInline_)마다, 그리고 화면을
// 다시 그릴 때마다 배열을 처음부터 훑고 있어서(find), 목록이 커지면 느려질 수 있다.
// state.characters 등은 loadLibraries()가 매번 "새 배열"로 통째로 교체하는 식이라(기존 배열을
// 수정하지 않음), 배열 인스턴스 자체에 이름->항목 맵을 캐시해두면 별도의 무효화 로직 없이도
// 항상 최신 상태를 반영한다 (새로 받아온 배열에는 캐시가 없으니 그때만 다시 만든다).
function findByName_(list, name) {
  if (!list) return undefined;
  if (!list.__byName) {
    var m = {};
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      if (it && !it.divider) m[it.name] = it;
    }
    list.__byName = m;
  }
  return list.__byName[name];
}
function findChar_(name) { return findByName_(state.characters, name); }
function findPet_(name) { return findByName_(state.pets, name); }
// 덱에 저장된 이미지 URL은 저장 시점에 찍힌 스냅샷이라 (특히 시트 셀 이미지의 임시 미리보기 링크였던 경우)
// 시간이 지나면 깨질 수 있다. 라이브러리에 같은 이름이 있으면 항상 최신 URL을 우선 쓰고,
// 라이브러리에 없을 때만 덱에 저장된 값을 그대로 쓴다.
function livePortrait_(name, fallback) {
  var lib = findChar_(name);
  return (lib && lib.portrait) || fallback || '';
}
function livePetImg_(name, fallback) {
  var lib = findPet_(name);
  // 서버가 펫 정보를 { name, image }로 내려주는데 여기서는 lib.img(오타)를 읽고 있어서
  // 이 "최신 URL로 교체" 기능이 사실상 한 번도 작동하지 않고 있었다. lib.image로 고친다.
  return (lib && lib.image) || fallback || '';
}
function findCard_(name) { return findByName_(state.cards, name); }
function findEquip_(kind, name) { return findByName_(state.equip[kind], name); }
// 카드/장비도 펫·캐릭터 초상화와 같은 이유로 "라이브러리에 최신 이미지가 있으면 그걸 우선 쓰고,
// 없을 때만 덱에 저장된 스냅샷을 쓴다"가 필요한데 이 처리 자체가 빠져 있었다.
function liveCardImg_(name, fallback) {
  var lib = findCard_(name);
  return (lib && lib.image) || fallback || '';
}
function liveEquipIcon_(kind, name, fallback) {
  var lib = findEquip_(kind, name);
  return (lib && lib.image) || fallback || '';
}

// list: {name} 항목과 {divider:true,label} 구분줄 항목이 섞인 배열(캐릭터/카드/펫/장비 라이브러리 공통 형식).
// 구분줄은 선택 불가능한 회색 옵션으로 표시된다.
// 카드 이름 끝에 붙는 "카드"라는 말은 화면에 표시할 때만 떼어낸다 (예: "염제 카드" -> "염제").
// 실제 값(선택/매칭용 value)은 원본 이름을 그대로 쓴다.
function stripCardWord_(name) {
  if (!name) return name;
  var stripped = String(name).replace(/\s*카드\s*$/, '').trim();
  return stripped || name;
}

function optionsHtml_(list, selected, labelFn) {
  var html = '<option value="">-</option>';
  (list || []).forEach(function (item) {
    if (item.divider) {
      html += '<option value="" disabled>── ' + esc(item.label) + ' ──</option>';
      return;
    }
    var label = labelFn ? labelFn(item.name) : item.name;
    html += '<option value="' + esc(item.name) + '"' + (item.name === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  });
  return html;
}

/* =========================================================
   드래그로 자리 바꾸기 — 캐릭터 세트(캐릭터+장비+카드) / 펫 / 스킬 타임라인 스텝 공통.
   Pointer Events 기반이라 마우스와 모바일 터치 모두에서 동작한다(손가락으로 꾹 누른 채 이동).
   각 항목의 "⠿" 손잡이를 누르고 있다가 다른 항목 위로 옮기면 두 항목이 서로 자리를 바꾼다.
========================================================= */
var _dragCtl = { active: null, inited: false };

function initDragReorderOnce_() {
  if (_dragCtl.inited) return;
  _dragCtl.inited = true;

  function clearDragOver(st) {
    st.container.querySelectorAll('.drag-over').forEach(function (el) { el.classList.remove('drag-over'); });
  }

  document.addEventListener('pointermove', function (e) {
    var st = _dragCtl.active;
    if (!st || e.pointerId !== st.pointerId) return;
    var dx = e.clientX - st.startX, dy = e.clientY - st.startY;
    if (!st.moved) {
      if (Math.hypot(dx, dy) < 6) return;
      st.moved = true;
      var rect = st.item.getBoundingClientRect();
      var ghost = st.item.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.left = rect.left + 'px';
      ghost.style.top = rect.top + 'px';
      ghost.style.width = rect.width + 'px';
      ghost.style.height = rect.height + 'px';
      document.body.appendChild(ghost);
      st.ghost = ghost;
      st.item.classList.add('drag-source');
    }
    st.ghost.style.left = (e.clientX - st.offsetX) + 'px';
    st.ghost.style.top = (e.clientY - st.offsetY) + 'px';
    st.ghost.style.display = 'none';
    var elUnder = document.elementFromPoint(e.clientX, e.clientY);
    st.ghost.style.display = '';
    var targetItem = elUnder && elUnder.closest ? elUnder.closest('[' + st.itemAttr + ']') : null;
    clearDragOver(st);
    if (targetItem && targetItem !== st.item) {
      targetItem.classList.add('drag-over');
      st.targetKey = targetItem.getAttribute(st.itemAttr);
    } else {
      st.targetKey = null;
    }
  });

  function endDrag(e) {
    var st = _dragCtl.active;
    if (!st || e.pointerId !== st.pointerId) return;
    if (st.ghost) st.ghost.remove();
    if (st.item) st.item.classList.remove('drag-source');
    clearDragOver(st);
    if (st.moved && st.targetKey && st.targetKey !== st.key) {
      st.onDrop(st.key, st.targetKey);
    }
    _dragCtl.active = null;
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}

// 손잡이 버튼 하나에 대해서만 드래그 시작 이벤트를 연결한다. 보통은 wireDragReorder_가 한 번에
// 여러 손잡이를 훑으며 이걸 호출하지만, ensureWarningPresent_처럼 전체를 다시 그리지 않고
// 항목 하나만 DOM에 새로 끼워 넣은 경우엔 이 함수만 따로 불러서 그 손잡이 하나만 연결한다
// (전체를 다시 훑으면 이미 연결된 기존 손잡이들에 이벤트가 중복으로 붙어버림).
function wireDragHandle_(handle, container, itemAttr, onDrop) {
  handle.addEventListener('pointerdown', function (e) {
    var item = handle.closest('[' + itemAttr + ']');
    if (!item) return;
    e.preventDefault();
    var rect = item.getBoundingClientRect();
    _dragCtl.active = {
      pointerId: e.pointerId,
      key: item.getAttribute(itemAttr),
      item: item,
      container: container,
      itemAttr: itemAttr,
      startX: e.clientX, startY: e.clientY,
      offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
      moved: false, ghost: null, targetKey: null,
      onDrop: onDrop
    };
  });
}

// container: 다시 그려질 때마다 새로 넘겨받는 루트 엘리먼트.
// handleSelector: 손잡이 버튼 셀렉터 (예: '[data-drag-handle="set"]').
// itemAttr: 손잡이가 속한 항목을 식별하는 data-* 속성 이름 (예: 'data-drag-set').
// onDrop(sourceKey, targetKey): 두 항목을 서로 바꿔치기하는 콜백.
function wireDragReorder_(container, handleSelector, itemAttr, onDrop) {
  initDragReorderOnce_();
  container.querySelectorAll(handleSelector).forEach(function (handle) {
    wireDragHandle_(handle, container, itemAttr, onDrop);
  });
}

/* =========================================================
   관리자 인라인 편집 — 화면에 보이는 이미지/글자를 직접 클릭해서 수정
========================================================= */
var WARN_SKILL_TIME_TEXT_ = '궁 시간 잘 맞춰주세요';

// 스킬 타임라인에 시간을 적으면 이 주의사항을 맨 앞에 자동으로 하나 끼워 넣는다(가장 중요한
// 주의사항이니 눈에 잘 띄게). 전체 화면을 다시 그리면 지금 시간을 입력 중인 칸의 커서 위치가
// 날아가버려서(contenteditable 특성상), 그 대신 주의사항 목록 맨 앞에 새 항목 DOM을 직접 하나
// 끼워 넣고 기존 항목들의 인덱스만 하나씩 밀어준 뒤 그 항목만 따로 이벤트를 연결한다.
function ensureWarningPresent_(container, deck, text) {
  deck.warnings = deck.warnings || [];
  if (deck.warnings.indexOf(text) !== -1) return;
  deck.warnings.unshift(text);
  var warnList = container.querySelector('.warn-list');
  if (!warnList) return; // 안전장치: 화면에 주의사항 영역 자체가 없으면 데이터만 반영해두고 넘어감
  // 화면에 이미 떠 있는 기존 항목들은 배열 상 인덱스가 전부 하나씩 밀렸으니, DOM에 박혀 있는
  // data-* 인덱스도 맞춰서 다시 매긴다(이벤트 핸들러는 클릭/입력 시점에 dataset 값을 그때 읽으므로,
  // 속성값만 고쳐주면 다시 연결할 필요는 없다).
  Array.prototype.forEach.call(warnList.querySelectorAll('.warn-item[data-drag-warn]'), function (existingItem) {
    var newIdx = String(Number(existingItem.getAttribute('data-drag-warn')) + 1);
    existingItem.setAttribute('data-drag-warn', newIdx);
    var f = existingItem.querySelector('[data-warn-field]');
    if (f) f.setAttribute('data-warn-field', newIdx);
    var r = existingItem.querySelector('[data-remove-warn]');
    if (r) r.setAttribute('data-remove-warn', newIdx);
  });
  var item = document.createElement('div');
  item.className = 'warn-item';
  item.setAttribute('data-drag-warn', '0');
  item.innerHTML = '※ <span class="editable-text" contenteditable="true" data-warn-field="0" data-placeholder="주의사항 입력">' + esc(text) + '</span>' +
    '<button type="button" class="tile-remove small" data-remove-warn="0" title="삭제">×</button>' +
    '<button type="button" class="drag-handle" data-drag-handle="warn" title="드래그해서 순서 바꾸기">⠿</button>';
  warnList.insertBefore(item, warnList.firstChild); // 항상 맨 앞
  var field = item.querySelector('[data-warn-field]');
  field.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); field.blur(); } });
  field.oninput = function () { deck.warnings[Number(field.dataset.warnField)] = field.textContent.trim(); };
  var removeBtn = item.querySelector('[data-remove-warn]');
  removeBtn.onclick = function () { deck.warnings.splice(Number(removeBtn.dataset.removeWarn), 1); renderCurrentDeck(); };
  var dragHandle = item.querySelector('[data-drag-handle="warn"]');
  wireDragHandle_(dragHandle, container, 'data-drag-warn', function (srcKey, tgtKey) {
    var warnings = deck.warnings || [];
    var si = Number(srcKey), ti = Number(tgtKey);
    var tmp = warnings[si];
    warnings[si] = warnings[ti];
    warnings[ti] = tmp;
    renderCurrentDeck();
  });
}

function wireAdminInline_(container, deck) {
  function refresh() { renderCurrentDeck(); }

  // 드래그로 자리 바꾸기: 캐릭터 세트(캐릭터+장비+카드가 한 세트) / 펫 / 스킬 타임라인 스텝
  wireDragReorder_(container, '[data-drag-handle="set"]', 'data-drag-set', function (srcKey, tgtKey) {
    var a = deck.characters[Number(srcKey)], b = deck.characters[Number(tgtKey)];
    if (!a || !b) return;
    var tmpCol = a.col, tmpSlot = a.slot;
    a.col = b.col; a.slot = b.slot;
    b.col = tmpCol; b.slot = tmpSlot;
    refresh();
  });
  // 카드만 단독으로 자리 바꾸기: 캐릭터/장비(col·slot·gear)는 그대로 두고 card만 서로 맞바꾼다.
  wireDragReorder_(container, '[data-drag-handle="card"]', 'data-drag-card', function (srcKey, tgtKey) {
    var a = deck.characters[Number(srcKey)], b = deck.characters[Number(tgtKey)];
    if (!a || !b) return;
    var tmp = a.card;
    a.card = b.card;
    b.card = tmp;
    refresh();
  });
  wireDragReorder_(container, '[data-drag-handle="pet"]', 'data-drag-pet', function (srcKey, tgtKey) {
    var pets = deck.pets || [];
    var a = pets.find(function (p) { return p.pos === srcKey; });
    var b = pets.find(function (p) { return p.pos === tgtKey; });
    if (a) a.pos = tgtKey;
    if (b) b.pos = srcKey;
    refresh();
  });
  wireDragReorder_(container, '[data-drag-handle="step"]', 'data-drag-step', function (srcKey, tgtKey) {
    var sp = srcKey.split(':'), tp = tgtKey.split(':');
    var sArr = deck.timeline.cycles[Number(sp[0])] && deck.timeline.cycles[Number(sp[0])].steps;
    var tArr = deck.timeline.cycles[Number(tp[0])] && deck.timeline.cycles[Number(tp[0])].steps;
    if (!sArr || !tArr) return;
    var si = Number(sp[1]), ti = Number(tp[1]);
    var tmp = sArr[si];
    sArr[si] = tArr[ti];
    tArr[ti] = tmp;
    // 순서(위치)가 바뀌면 그 자리에 맞던 궁 시간/메모도 더 이상 안 맞는 경우가 대부분이라
    // 캐릭터를 바꿀 때와 똑같이 자동으로 비워서 새로 적게 한다.
    if (sArr[si]) { sArr[si].tag = ''; sArr[si].memo = ''; }
    if (tArr[ti]) { tArr[ti].tag = ''; tArr[ti].memo = ''; }
    refresh();
  });
  wireDragReorder_(container, '[data-drag-handle="warn"]', 'data-drag-warn', function (srcKey, tgtKey) {
    var warnings = deck.warnings || [];
    var si = Number(srcKey), ti = Number(tgtKey);
    var tmp = warnings[si];
    warnings[si] = warnings[ti];
    warnings[ti] = tmp;
    refresh();
  });

  // 이미지 클릭 → 드롭다운 교체 계열
  container.querySelectorAll('[data-edit-char]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editChar);
      var c = deck.characters[idx];
      c.name = e.target.value;
      var lib = findChar_(c.name);
      c.portrait = lib ? lib.portrait : '';
      // 카드는 캐릭터와 별개로 관리하므로 여기서는 건드리지 않는다.
      // 캐릭터의 직업(기사/법사/힐러/사수)에 맞는 기본 무기/갑옷/장신구/룬을 자동으로 채워준다.
      // 새 덱에서 캐릭터를 처음 고를 때든, 기존 덱에서 캐릭터를 바꿀 때든 똑같이 적용된다.
      // "직업별 기본장비" 시트에 값이 없으면(직업 정보가 없거나 매칭이 안 되면) 아무것도 바꾸지 않는다.
      var defaults = lib && lib.role ? state.jobGear[lib.role] : null;
      if (defaults) {
        c.weapon = gearFromEquip_('weapon', defaults.weapon);
        c.armor = gearFromEquip_('armor', defaults.armor);
        c.item = gearFromEquip_('item', defaults.item);
        c.rune = gearFromEquip_('rune', defaults.rune);
      }
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-card]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editCard);
      var c = deck.characters[idx];
      var name = e.target.value;
      var lib = findCard_(name);
      c.card = { name: name, img: lib ? lib.image : '' };
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-gear]').forEach(function (sel) {
    sel.onchange = function (e) {
      var parts = sel.dataset.editGear.split(':');
      var idx = Number(parts[0]), kind = parts[1];
      deck.characters[idx][kind] = gearFromEquip_(kind, e.target.value);
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-pet]').forEach(function (sel) {
    sel.onchange = function (e) {
      var pos = sel.dataset.editPet;
      var name = e.target.value;
      deck.pets = (deck.pets || []).filter(function (p) { return p.pos !== pos; });
      if (name) {
        var lib = findPet_(name);
        deck.pets.push({ pos: pos, name: name, img: lib ? lib.image : '' });
      }
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-pos]').forEach(function (sel) {
    sel.onchange = function (e) {
      var idx = Number(sel.dataset.editPos);
      var parts = e.target.value.split(':');
      var newCol = parts[0], newSlot = Number(parts[1]);
      var moving = deck.characters[idx];
      var oldCol = moving.col, oldSlot = moving.slot;
      // 고른 자리를 이미 다른 캐릭터가 차지하고 있으면, 그 캐릭터를 지금 옮기는 캐릭터가 있던
      // 자리로 서로 맞바꾼다. 이걸 안 하면 같은 자리(예: 중열1)에 캐릭터가 둘 겹쳐서 배치 박스가
      // 꼬여 보이는 문제가 있었다.
      var occupant = deck.characters.find(function (c, i) { return i !== idx && c.col === newCol && c.slot === newSlot; });
      if (occupant) {
        occupant.col = oldCol;
        occupant.slot = oldSlot;
      }
      moving.col = newCol;
      moving.slot = newSlot;
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-step]').forEach(function (sel) {
    sel.onchange = function (e) {
      var parts = sel.dataset.editStep.split(':');
      var ci = Number(parts[0]), si = Number(parts[1]);
      var s = deck.timeline.cycles[ci].steps[si];
      s.name = e.target.value;
      var lib = findChar_(s.name);
      s.img = lib ? lib.portrait : '';
      // 캐릭터가 바뀌면 궁 시간/메모는 대부분 그 캐릭터에 맞춰 다시 써야 하는 값이라, 남아있는
      // 이전 값을 그대로 두면 헷갈리기만 한다. 캐릭터를 바꿀 때 자동으로 비워서 새로 적게 한다.
      s.tag = '';
      s.memo = '';
      refresh();
    };
  });
  container.querySelectorAll('[data-edit-boss]').forEach(function (el) {
    el.onclick = function () {
      var v = prompt('보스 이미지 URL을 입력하세요', deck.bossIcon || '');
      if (v === null) return;
      deck.bossIcon = v.trim();
      refresh();
    };
  });
  // 글자 클릭 → 바로 수정 (contenteditable). 재렌더링 없이 데이터만 갱신해서 커서 위치 유지.
  container.querySelectorAll('[contenteditable="true"]').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
  container.querySelectorAll('[data-field]').forEach(function (el) {
    el.oninput = function () {
      deck[el.dataset.field] = el.textContent.trim();
      // 태그를 입력하는 동안 제목 옆 "2(생존)" 표시도 바로 반영한다(그룹이 있는 덱만 —
      // 제목이 자동 생성이라 여기서 다시 계산해줘야 함. 전체 재렌더링은 커서 위치가
      // 튀니까 안 하고, 제목 글자만 직접 바꿔치기한다).
      if (el.dataset.field === 'noteTag' && deckGroup_(deck)) {
        deck.title = deckPositionLabel_(deck);
        var h1 = container.querySelector('.title-text h1');
        if (h1) h1.textContent = deck.title;
      }
    };
  });
  container.querySelectorAll('[data-step-field]').forEach(function (el) {
    el.oninput = function () {
      var parts = el.dataset.stepField.split(':');
      var field = parts[0];
      var value = el.textContent.trim();
      deck.timeline.cycles[Number(parts[1])].steps[Number(parts[2])][field] = value;
      // 스킬 타임라인에 궁 시간을 적으면 "궁 시간 잘 맞춰주세요" 주의사항을 자동으로 하나 추가한다
      // (관리자가 매번 손으로 추가하지 않아도 되게). 이미 있으면 중복으로 또 추가하지 않는다.
      if (field === 'tag' && value) ensureWarningPresent_(container, deck, WARN_SKILL_TIME_TEXT_);
    };
  });
  container.querySelectorAll('[data-cycle-field]').forEach(function (el) {
    el.oninput = function () { deck.timeline.cycles[Number(el.dataset.cycleField)].label = el.textContent.trim(); };
  });
  container.querySelectorAll('[data-warn-field]').forEach(function (el) {
    el.oninput = function () { deck.warnings[Number(el.dataset.warnField)] = el.textContent.trim(); };
  });

  // 삭제 버튼
  container.querySelectorAll('[data-remove-char]').forEach(function (btn) {
    btn.onclick = function () { deck.characters.splice(Number(btn.dataset.removeChar), 1); refresh(); };
  });
  container.querySelectorAll('[data-remove-step]').forEach(function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.removeStep.split(':');
      deck.timeline.cycles[Number(parts[0])].steps.splice(Number(parts[1]), 1);
      refresh();
    };
  });
  container.querySelectorAll('[data-remove-cycle]').forEach(function (btn) {
    btn.onclick = function () { deck.timeline.cycles.splice(Number(btn.dataset.removeCycle), 1); refresh(); };
  });
  container.querySelectorAll('[data-remove-warn]').forEach(function (btn) {
    btn.onclick = function () { deck.warnings.splice(Number(btn.dataset.removeWarn), 1); refresh(); };
  });

  // 추가 버튼
  var addCharBtn = container.querySelector('[data-add-char]');
  if (addCharBtn) addCharBtn.onclick = function () {
    deck.characters = deck.characters || [];
    // 항상 "전열1"에 추가하면 이미 전열1에 캐릭터가 있을 때 자리가 겹쳐버린다.
    // 아직 아무도 없는 자리를 앞쪽(전열1,2 → 중열1,2 → 후열1,2) 순서로 찾아서 거기에 넣고,
    // 6자리가 이미 다 찼으면(드문 경우) 예전처럼 전열1에 넣어 겹치더라도 자리를 만든다.
    var taken = {};
    deck.characters.forEach(function (c) { taken[c.col + ':' + c.slot] = true; });
    var freeSpot = POS_OPTIONS.find(function (p) { return !taken[p[0]]; });
    var col = '전열', slot = 1;
    if (freeSpot) { var parts = freeSpot[0].split(':'); col = parts[0]; slot = Number(parts[1]); }
    deck.characters.push({ col: col, slot: slot, name: '', portrait: '', weapon: {}, armor: {}, item: {}, rune: {}, card: {} });
    refresh();
  };
  container.querySelectorAll('[data-add-step]').forEach(function (btn) {
    btn.onclick = function () {
      var ci = Number(btn.dataset.addStep);
      deck.timeline.cycles[ci].steps.push({ name: '', img: '', tag: '', memo: '' });
      refresh();
    };
  });
  var addCycleBtn = container.querySelector('[data-add-cycle]');
  if (addCycleBtn) addCycleBtn.onclick = function () {
    if (!deck.timeline) deck.timeline = { cycles: [] };
    deck.timeline.cycles.push({ label: (deck.timeline.cycles.length + 1) + '사이클', steps: [] });
    refresh();
  };
  var clearTimesBtn = container.querySelector('[data-clear-times]');
  if (clearTimesBtn) clearTimesBtn.onclick = function () {
    if (!confirm('모든 사이클의 시간을 다 지울까요? (메모는 그대로 남습니다)')) return;
    (deck.timeline.cycles || []).forEach(function (cy) {
      (cy.steps || []).forEach(function (s) { s.tag = ''; });
    });
    refresh();
  };
  container.querySelectorAll('[data-clear-step-time]').forEach(function (btn) {
    btn.onclick = function () {
      var parts = btn.dataset.clearStepTime.split(':');
      var s = deck.timeline.cycles[Number(parts[0])].steps[Number(parts[1])];
      if (s) s.tag = '';
      refresh();
    };
  });
  var addWarnBtn = container.querySelector('[data-add-warn]');
  if (addWarnBtn) addWarnBtn.onclick = function () {
    deck.warnings = deck.warnings || [];
    deck.warnings.push('');
    refresh();
  };
}

// 아직 한 번도 저장하지 않은 새 덱(state.decks 목록에 없음)은 서버에 실제로 존재하지 않아서
// "삭제"를 누르면 서버가 못 찾아 실패 알림이 뜨고, "되돌리기"를 누르면 selectDeck이 서버에서
// 못 찾아(NOT_FOUND) "불러오기 실패" 화면으로 가버려 작업 중이던 내용이 그냥 날아가 버렸다.
// 저장 전 새 덱일 때는 두 버튼 다 그냥 "이 새 덱 만들기를 취소하고 아무 것도 선택 안 한 상태로
// 돌아가기"로 동작하게 한다.
function isDraftDeck_() {
  return !!state.currentId && !state.decks.some(function (d) { return d.id === state.currentId; });
}
function discardDraftDeck_() {
  state.currentId = null;
  state.currentDeck = null;
  renderDeckSelect_();
  renderCurrentDeck();
}
function wireAdminBar_(deck) {
  document.getElementById('admin-save-btn').onclick = function () { saveDeck_ui(deck); };
  document.getElementById('admin-delete-btn').onclick = function () {
    if (isDraftDeck_()) {
      if (!confirm('저장하지 않은 새 덱을 취소할까요?')) return;
      discardDraftDeck_();
      return;
    }
    deleteDeck_ui(deck.id);
  };
  document.getElementById('admin-revert-btn').onclick = function () {
    if (isDraftDeck_()) {
      if (!confirm('저장하지 않은 새 덱을 취소할까요?')) return;
      discardDraftDeck_();
      return;
    }
    if (!confirm('저장하지 않은 수정 내용을 취소하고 마지막 저장 상태로 되돌릴까요?')) return;
    if (state.currentId) selectDeck(state.currentId);
  };
}

/* ---------- 관리자: 새 캐릭터/카드/장비/펫 추가 모달 ---------- */
function openAddItemModal() {
  document.getElementById('add-item-name').value = '';
  document.getElementById('add-item-file').value = '';
  var msg = document.getElementById('add-item-msg');
  msg.textContent = '';
  msg.className = 'msg';
  document.getElementById('add-item-modal').style.display = 'flex';
}

function closeAddItemModal() {
  document.getElementById('add-item-modal').style.display = 'none';
}

function fileToBase64_(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || '');
      var comma = result.indexOf(',');
      resolve(comma === -1 ? result : result.substring(comma + 1));
    };
    reader.onerror = function () { reject(new Error('파일을 읽지 못했습니다.')); };
    reader.readAsDataURL(file);
  });
}

function submitAddItem() {
  var kind = document.getElementById('add-item-kind').value;
  var name = document.getElementById('add-item-name').value.trim();
  var fileInput = document.getElementById('add-item-file');
  var msg = document.getElementById('add-item-msg');
  var submitBtn = document.getElementById('add-item-submit-btn');

  if (!name) { msg.textContent = '이름을 입력해주세요.'; msg.className = 'msg err'; return; }
  if (!fileInput.files || !fileInput.files[0]) { msg.textContent = '이미지 파일을 선택해주세요.'; msg.className = 'msg err'; return; }
  var file = fileInput.files[0];

  msg.textContent = '업로드 중입니다... 잠시 기다려주세요.';
  msg.className = 'msg';
  submitBtn.disabled = true;

  fileToBase64_(file).then(function (base64) {
    return api('addLibraryItem', {}, 'POST', {
      pw: state.adminPw, kind: kind, name: name, imageBase64: base64, mimeType: file.type || 'image/png'
    });
  }).then(function (res) {
    submitBtn.disabled = false;
    if (res.ok) {
      msg.textContent = '추가되었습니다! 잠시 후 드롭다운에서 바로 쓸 수 있어요.';
      msg.className = 'msg ok';
      // 캐시된 라이브러리를 비워서 다음에 다시 최신 상태로 불러오게 한다.
      state.characters = [];
      state.pets = [];
      state.cards = [];
      state.equip = { weapon: [], armor: [], item: [], rune: [] };
      loadLibraries(true).then(function () {
        if (state.currentDeck) renderCurrentDeck();
      });
    } else {
      msg.textContent = '추가 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  }).catch(function () {
    submitBtn.disabled = false;
    msg.textContent = '업로드 중 오류가 발생했습니다.';
    msg.className = 'msg err';
  });
}

/* =========================================================
   목록 관리 — 캐릭터/카드/펫/장비 각각의 "주요목록_*" 시트를 웹앱에서 직접 편집.
   드래그로 칸 사이를 옮기고, 추가/삭제도 여기서 바로 하고, 저장하면 서버의 해당
   시트를 통째로 다시 써준다(setDropdownList_). 시트를 직접 열 필요가 없어진다.
   캐릭터/카드/펫은 "주요/나머지" 2칸, 장비 4종은 "기사/법사/힐러/사수" 직업별 칸으로 나뉜다
   (장비는 딱히 주요/나머지 구분이 의미가 없고, 직업마다 쓸 수 있는 장비가 달라서 직업별이 더 쓸모있다).
========================================================= */
var LIB_CATEGORY_CONFIG_ = {
  character: { buckets: ['주요', '나머지'], mode: 'position' },
  card: { buckets: ['주요', '나머지'], mode: 'position' },
  pet: { buckets: ['주요', '나머지'], mode: 'position' },
  weapon: { buckets: ['공용', '기사', '법사', '힐러', '사수'], mode: 'label' },
  armor: { buckets: ['공용', '기사', '법사', '힐러', '사수'], mode: 'label' },
  item: { buckets: ['공용', '기사', '법사', '힐러', '사수'], mode: 'label' },
  rune: { buckets: ['공용', '기사', '법사', '힐러', '사수'], mode: 'label' }
};
var LIB_UNSORTED_BUCKET_ = '미분류'; // 'label' 모드에서 아직 직업이 안 정해진(구분줄 라벨이 안 맞는) 항목이 모이는 칸

// entries(서버가 보내준 원시 구조)를 화면에 그릴 "칸별 이름 목록"으로 바꾼다.
// mode: 'position' - 캐릭터/카드/펫처럼, 첫 구간은 buckets[0](주요)로, 그 뒤 구간은 전부
//   buckets[1](나머지)로 합친다 (구분줄에 어떤 글자가 적혀 있었는지는 안 보고 순서로만 판단 —
//   예전에 "주요 캐릭"/"나머지 캐릭"처럼 다른 문구를 써뒀어도 그대로 인식되게 하기 위함).
// mode: 'label' - 장비처럼, 구분줄 라벨 글자가 buckets 중 하나와 정확히 같을 때만 그 칸으로 넣고,
//   구분줄이 아예 없거나(예전 방식 그대로 둔 경우) 모르는 라벨이면 "미분류" 칸에 넣는다.
function bucketizeLibEntries_(entries, config) {
  var buckets = {};
  config.buckets.forEach(function (b) { buckets[b] = []; });

  if (config.mode === 'label') {
    buckets[LIB_UNSORTED_BUCKET_] = [];
    var curLabel = LIB_UNSORTED_BUCKET_;
    (entries || []).forEach(function (e) {
      if (e.divider) { curLabel = config.buckets.indexOf(e.label) !== -1 ? e.label : LIB_UNSORTED_BUCKET_; return; }
      buckets[curLabel].push(e.name);
    });
    return buckets;
  }

  // position 모드
  // 예전엔 "처음 만나는 구분줄이면 무조건 나머지 칸으로 전환"하는 방식이었는데, 그러면 저장할 때
  // 항상 맨 위에 "-주요-" 구분줄부터 써두는 saveLibraryList_와 맞물려서 문제가 생겼다: 시트 맨 위의
  // "-주요-" 자체가 "처음 만나는 구분줄"이 되어버려서, 그 아래 실제 주요 항목들까지 전부 나머지로
  // 잘못 분류되고, 그대로 다시 저장하면 주요 구간이 영구히 사라졌다.
  // 그래서 이제는 구분줄 라벨이 buckets 중 하나와 정확히 같으면 그 칸으로 바로 이동하고,
  // (예전에 "나머지 캐릭"처럼 다른 문구를 써뒀던 경우처럼) 못 알아보는 라벨을 만났을 때만
  // "순서상 다음 칸"으로 넘어가는 예전 방식으로 대체한다 — 두 경우 다 올바르게 처리된다.
  var current = config.buckets[0];
  var bucketIdx = 0;
  (entries || []).forEach(function (e) {
    if (e.divider) {
      var label = e.label || '';
      var labelIdx = config.buckets.indexOf(label);
      if (labelIdx === -1) {
        // 정확히 같은 문구는 아니어도 "주요 캐릭"처럼 버킷 이름으로 시작하는 예전 라벨이면
        // 그 버킷으로 바로 보낸다(예: "주요"로 시작 -> 주요 칸). 이걸 안 하면 "-주요 캐릭-"
        // 같은 예전 라벨이 위 새 방식으로도 인식되지 않아 순서상 다음 칸(나머지)으로 밀려서,
        // 주요 항목이 전부 나머지로 잘못 분류되는 문제가 그대로 남는다.
        labelIdx = config.buckets.findIndex(function (b) { return label.indexOf(b) === 0; });
      }
      if (labelIdx !== -1) {
        bucketIdx = labelIdx;
      } else {
        bucketIdx = Math.min(bucketIdx + 1, config.buckets.length - 1);
      }
      current = config.buckets[bucketIdx];
      return;
    }
    buckets[current].push(e.name);
  });
  return buckets;
}

function libBucketNames_() {
  var names = state.libManage.config.buckets.slice();
  if (state.libManage.config.mode === 'label') names.push(LIB_UNSORTED_BUCKET_);
  return names;
}

function openLibraryManageModal() {
  document.getElementById('lib-manage-modal').style.display = 'flex';
  var cat = document.getElementById('lib-manage-category').value || 'character';
  loadLibraryCategory_(cat);
}

function closeLibraryManageModal() {
  document.getElementById('lib-manage-modal').style.display = 'none';
}

function loadLibraryCategory_(category) {
  var msg = document.getElementById('lib-manage-msg');
  msg.textContent = '불러오는 중...';
  msg.className = 'msg';
  document.getElementById('lib-cols-container').innerHTML = '';
  var config = LIB_CATEGORY_CONFIG_[category];
  api('libraryManage', { pw: state.viewPw, category: category }).then(function (res) {
    if (!res.ok) { msg.textContent = '불러오기 실패: ' + (res.error || ''); msg.className = 'msg err'; return; }
    var itemsByName = {};
    (res.items || []).forEach(function (it) { itemsByName[it.name] = it; });
    state.libManage = {
      category: category,
      config: config,
      items: res.items || [],
      itemsByName: itemsByName,
      buckets: bucketizeLibEntries_(res.entries || [], config)
    };
    msg.textContent = '';
    msg.className = 'msg';
    renderLibLists_();
  }).catch(function () {
    msg.textContent = '불러오기 중 오류가 발생했습니다.';
    msg.className = 'msg err';
  });
}

function renderLibLists_() {
  var container = document.getElementById('lib-cols-container');
  var names = libBucketNames_();
  container.innerHTML = names.map(function (b) {
    return '<div class="lib-col" data-lib-bucket="' + esc(b) + '"><h4>' + esc(b) + '</h4>' +
      '<div class="lib-chip-list" id="lib-col-' + esc(b) + '"></div></div>';
  }).join('');
  names.forEach(renderLibBucket_);
  wireLibDrag_();
  renderLibAddSelect_();
}

function renderLibBucket_(bucket) {
  var container = document.getElementById('lib-col-' + bucket);
  var names = state.libManage.buckets[bucket] || [];
  if (!names.length) {
    container.innerHTML = '<div class="lib-empty-hint">(비어있음 — 여기로 항목을 드래그)</div>';
    return;
  }
  container.innerHTML = names.map(function (name) {
    var item = state.libManage.itemsByName[name];
    var img = item ? item.image : '';
    return '<div class="lib-chip" draggable="true" data-lib-name="' + esc(name) + '">' +
      (img ? '<img src="' + esc(img) + '" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
      '<span class="lib-chip-name">' + esc(name) + '</span>' +
      '<button type="button" class="lib-chip-remove" data-lib-remove="' + esc(name) + '" title="목록에서 제거">×</button>' +
      '</div>';
  }).join('');
}

function wireLibDrag_() {
  document.querySelectorAll('.lib-chip').forEach(function (chip) {
    chip.ondragstart = function (e) {
      e.dataTransfer.setData('text/plain', chip.dataset.libName);
      chip.classList.add('dragging');
    };
    chip.ondragend = function () { chip.classList.remove('dragging'); };
  });
  document.querySelectorAll('.lib-col').forEach(function (col) {
    col.ondragover = function (e) { e.preventDefault(); col.classList.add('drag-over'); };
    col.ondragleave = function () { col.classList.remove('drag-over'); };
    col.ondrop = function (e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      var name = e.dataTransfer.getData('text/plain');
      // 브라우저 밖(다른 탭/앱)에서 아무 텍스트나 끌어다 놓으면 그 텍스트가 그대로 라이브러리
      // 항목 이름으로 저장돼버릴 수 있어서, 실제로 이 목록에 있는 항목인지 확인한 뒤에만 옮긴다.
      if (name && state.libManage.itemsByName && state.libManage.itemsByName[name]) {
        moveLibEntry_(name, col.dataset.libBucket);
      }
    };
  });
  document.querySelectorAll('[data-lib-remove]').forEach(function (btn) {
    btn.onclick = function () { removeLibEntry_(btn.dataset.libRemove); };
  });
}

function moveLibEntry_(name, targetBucket) {
  var buckets = state.libManage.buckets;
  libBucketNames_().forEach(function (b) {
    var idx = buckets[b].indexOf(name);
    if (idx !== -1) buckets[b].splice(idx, 1);
  });
  buckets[targetBucket].push(name);
  renderLibLists_();
}

function removeLibEntry_(name) {
  var buckets = state.libManage.buckets;
  libBucketNames_().forEach(function (b) {
    var idx = buckets[b].indexOf(name);
    if (idx !== -1) buckets[b].splice(idx, 1);
  });
  renderLibLists_();
}

function renderLibAddSelect_() {
  var sel = document.getElementById('lib-add-select');
  var used = {};
  libBucketNames_().forEach(function (b) { state.libManage.buckets[b].forEach(function (n) { used[n] = true; }); });
  var candidates = (state.libManage.items || []).filter(function (it) { return !used[it.name]; });
  sel.innerHTML = '<option value="">추가할 항목 선택... (' + candidates.length + '개 남음)</option>' +
    candidates.map(function (it) { return '<option value="' + esc(it.name) + '">' + esc(it.name) + '</option>'; }).join('');
}

function addLibraryEntry_() {
  var sel = document.getElementById('lib-add-select');
  var name = sel.value;
  if (!name) return;
  // 새로 추가된 항목은 일단 마지막 칸(주요/나머지면 나머지, 직업별이면 미분류)에 넣고 드래그로 옮기게 한다.
  var names = libBucketNames_();
  state.libManage.buckets[names[names.length - 1]].push(name);
  renderLibLists_();
}

function saveLibraryList_() {
  if (!state.libManage || !state.libManage.category) return;
  var msg = document.getElementById('lib-manage-msg');
  var btn = document.getElementById('lib-manage-save-btn');
  var entries = [];
  libBucketNames_().forEach(function (b) {
    entries.push({ divider: true, label: b });
    state.libManage.buckets[b].forEach(function (n) { entries.push({ name: n }); });
  });

  msg.textContent = '저장 중...';
  msg.className = 'msg';
  btn.disabled = true;
  api('saveDropdownList', {}, 'POST', { pw: state.adminPw, category: state.libManage.category, entries: entries }).then(function (res) {
    btn.disabled = false;
    if (res.ok) {
      msg.textContent = '저장되었습니다! 잠시 후 드롭다운에 반영돼요.';
      msg.className = 'msg ok';
      // 캐시된 라이브러리를 비워서 다음에 다시 최신 상태로 불러오게 한다.
      state.characters = [];
      state.pets = [];
      state.cards = [];
      state.equip = { weapon: [], armor: [], item: [], rune: [] };
      loadLibraries(true).then(function () {
        if (state.currentDeck) renderCurrentDeck();
      });
    } else {
      msg.textContent = '저장 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  }).catch(function () {
    btn.disabled = false;
    msg.textContent = '저장 중 오류가 발생했습니다.';
    msg.className = 'msg err';
  });
}

function gearFromEquip_(kind, name) {
  if (!name) return { name: '', icon: '' };
  var lib = findEquip_(kind, name);
  return { name: name, icon: lib ? lib.image : '' };
}

function saveDeck_ui(d) {
  var msg = document.getElementById('save-msg');
  var btn = document.getElementById('admin-save-btn');
  // 저장 버튼을 비활성화하지 않으면, 응답이 오기 전에 두 번 눌렀을 때 같은 덱이 서버에
  // 중복 행으로 저장될 수 있다(둘 다 "행 없음"으로 판단해서 각자 새 행을 추가함).
  if (btn) btn.disabled = true;
  msg.textContent = '저장 중...';
  msg.className = 'msg';
  // 새 덱을 만들 때 미리 깔아둔 빈 캐릭터 칸(이름 미지정)은 저장에서 제외한다.
  var payload = Object.assign({}, d, {
    characters: (d.characters || []).filter(function (c) { return c.name; })
  });
  // 처음 저장하는(=아직 state.decks 목록에 없는) 새 덱인지를 미리 기억해둔다 — 새 덱을 만들 때
  // 정해둔 order:1은 "이 그룹 맨 앞에 끼워넣기" 용도로 딱 한 번만 반영해야 하는데, 이 구분 없이
  // 저장할 때마다 반영하면 이미 순서를 바꿔둔 기존 덱도 저장할 때마다 다시 order:1로 되돌아가버린다.
  var isFirstSave = !state.decks.some(function (x) { return x.id === d.id; });
  api('save', {}, 'POST', { pw: state.adminPw, deck: payload, who: '관리자' }).then(function (res) {
    if (btn) btn.disabled = false;
    if (res.ok) {
      msg.textContent = '저장되었습니다.';
      msg.className = 'msg ok';
      // 저장 요청이 오가는 동안 사용자가 다른 덱으로 이미 넘어갔을 수도 있다 — 그럴 때 여기서
      // state.currentDeck을 무조건 d로 덮어써버리면, 화면과 드롭다운은 새로 고른 덱인데 내부
      // "현재 덱" 상태만 방금 저장한 옛 덱으로 되돌아가서 이미지 저장/순서 변경이 엉뚱한 덱을
      // 기준으로 동작하게 된다. 지금도 같은 덱을 보고 있을 때만 반영한다.
      if (state.currentId === d.id) state.currentDeck = d;
      var found = state.decks.find(function (x) { return x.id === d.id; });
      if (found) { found.title = d.title; found.category = d.category; found.group = d.group || ''; found.tag = d.noteTag || ''; }
      else state.decks.push({ id: d.id, title: d.title, category: d.category, group: d.group || '', order: d.order || '', tag: d.noteTag || '' });
      renderDeckList();
      // order는 저장 전용 칼럼이라 일반 저장(action:'save')이 건드리지 않는다 — 새 덱을 "처음" 저장할 때
      // (order:1로 만들어둔 값)만 여기서 따로 한 번 반영해준다. 그 이후엔 "순서" 드롭다운으로만 바꾼다.
      if (isFirstSave && d.order) {
        api('setOrder', {}, 'POST', { pw: state.adminPw, id: d.id, order: d.order }).then(function (orderRes) {
          if (!orderRes || !orderRes.ok) {
            alert('순서 반영에 실패했습니다. "순서" 드롭다운으로 다시 지정해주세요.');
          }
        }).catch(function () {
          alert('순서 반영 중 통신 오류가 발생했습니다. "순서" 드롭다운으로 다시 지정해주세요.');
        });
      }
    } else {
      msg.textContent = '저장 실패: ' + (res.error || '');
      msg.className = 'msg err';
    }
  }).catch(function () {
    if (btn) btn.disabled = false;
    msg.textContent = '저장 중 통신 오류가 발생했습니다. 다시 시도해주세요.';
    msg.className = 'msg err';
  });
}

function deleteDeck_ui(id) {
  if (!confirm('이 덱을 삭제할까요? 되돌릴 수 없습니다.')) return;
  var msg = document.getElementById('save-msg');
  if (msg) { msg.textContent = '삭제 중...'; msg.className = 'msg'; }
  api('delete', {}, 'POST', { pw: state.adminPw, id: id }).then(function (res) {
    if (res.ok) {
      state.decks = state.decks.filter(function (x) { return x.id !== id; });
      state.currentId = null;
      state.currentDeck = null;
      renderCurrentDeck();
      renderDeckList();
    } else {
      if (msg) { msg.textContent = ''; }
      alert('삭제 실패: ' + (res.error || ''));
    }
  }).catch(function () {
    if (msg) { msg.textContent = ''; }
    alert('삭제 중 통신 오류가 발생했습니다.');
  });
}

/* ---------- 시작 ---------- */
(function init() {
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('gn_theme'); } catch (e) {}
  if (savedTheme) setTheme(savedTheme);

  var savedPw = null;
  try { savedPw = localStorage.getItem('gn_view_pw'); } catch (e) {}
  if (savedPw) {
    document.getElementById('gate-pw').value = savedPw;
    tryLogin();
  }
})();
</script>
