<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가온누리 덱 모음</title>
<!-- 예전엔 CSS에 font-family: "Pretendard"라고만 써놨는데, 정작 폰트 파일을 불러오는 곳이
     없어서 실제로는 대부분 기기에서 시스템 기본 글꼴(맑은 고딕 등)로 보이고 있었다.
     Pretendard를 실제로 화면/저장 이미지 둘 다에 적용되도록 CDN에서 제대로 불러온다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<!-- 수집형 게임 느낌에 맞게 제목/본문에 둥글둥글하고 귀여운 느낌의 구글 폰트 "Jua"를
     Pretendard보다 앞순위로 적용한다(숫자/기호처럼 Jua에 없는 글자만 자동으로 Pretendard로 대체됨). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<!-- 덱을 이미지로 저장/공유하는 기능에 쓰는 DOM 캡처 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel2: #23262f;
    --border: #333744;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --blue: #4fa3e3;
    --gold: #e0b13a;
    --red: #e0505a;
    --pink: #e07ab0;
    /* 타임라인(스텝 이름/시간/메모)과 주의사항 글씨 크기를 각각 따로 관리자가 조절할 수 있게
     * 하는 변수(-10px~10px). 서버(구글 시트, PropertiesService)에 저장된 값을 로그인 직후
     * 이 변수들에 반영한다. 화면 캡처(이미지로 저장/공유)도 같은 문서 안에 그려서 찍기 때문에
     * 이 변수를 그대로 물려받는다 — 그래서 이 값을 바꾸면 스크린샷에도 자동으로 반영된다. */
    --font-adjust-tl: 0px;
    --font-adjust-warn: 0px;
  }
  :root[data-theme="light"] {
    --bg: #eef1f6;
    --panel: #ffffff;
    --panel2: #f4f6f9;
    --border: #dbe1ea;
    --text: #1c2230;
    --muted: #6b7280;
    --blue: #2f80c9;
    --gold: #a8790e;
    --red: #cf3f4a;
    --pink: #c65a91;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 24px;
    transition: background .15s, color .15s;
  }
  a { color: var(--blue); }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button { cursor: pointer; }

  /* ---------- 로그인 게이트 ---------- */
  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gate .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px 28px; width: 320px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 18px; }
  #gate p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }
  #gate input { width: 100%; margin-bottom: 10px; }
  #gate button { width: 100%; background: var(--blue); color: #fff; border: none; font-weight: 400; padding: 8px; }
  #gate .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    max-width: 960px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 18px; margin: 0; }
  .topbar .right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill-btn {
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
    font-size: 12px; padding: 6px 14px; border-radius: 20px;
  }
  .pill-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 400; }
  .pill-btn.admin-on { background: var(--red); color: #fff; border-color: var(--red); font-weight: 400; }

  .layout { max-width: 960px; margin: 0 auto; }
  .main { min-width: 0; }

  /* ---------- 메뉴 (카테고리 → 그룹 → 번호, 드롭다운 3단) ---------- */
  .menu-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .menu-row select {
    flex: 1 1 140px; min-width: 110px; padding: 10px 30px 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 400; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23888' d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 14px;
  }
  .menu-row select:disabled { opacity: 0.45; cursor: default; }
  .menu-row select:focus { outline: none; border-color: var(--blue); }
  #sel-category { font-weight: 400; }

  /* ---------- 로딩 표시 ---------- */
  .loading-msg {
    display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px;
    padding: 10px 4px;
  }
  .loading-msg .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--blue);
    animation: gn-spin 0.7s linear infinite;
  }
  @keyframes gn-spin { to { transform: rotate(360deg); } }

  /* ---------- 새 항목 추가 모달 ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    max-height: 85vh; overflow-y: auto; box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; }
  .modal-field { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .modal-field select, .modal-field input {
    display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 14px; box-sizing: border-box;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; flex: 0 0 auto; }

  /* ---------- 목록 관리 모달 (주요/나머지 드래그 관리) ---------- */
  .modal-box.wide { max-width: 920px; }
  .lib-add-row { display: flex; gap: 8px; margin-bottom: 14px; flex: 0 0 auto; }
  .lib-add-row select { flex: 1 1 auto; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 13px; }
  .lib-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .lib-col { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 160px; max-height: 50vh; overflow-y: auto; }
  .lib-col h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .lib-col.drag-over { outline: 2px dashed var(--blue); outline-offset: -2px; }
  .lib-chip-list { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .lib-chip {
    display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; cursor: grab; user-select: none;
  }
  .lib-chip.dragging { opacity: 0.35; }
  .lib-chip img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; background: var(--panel2); flex: 0 0 auto; }
  .lib-chip .lib-chip-name { flex: 1 1 auto; font-size: 12.5px; }
  .lib-chip .lib-chip-remove { flex: 0 0 auto; width: 18px; height: 18px; line-height: 16px; padding: 0; border-radius: 50%; border: none; background: rgba(0,0,0,0.35); color: #fff; font-size: 12px; cursor: pointer; }
  .lib-empty-hint { color: var(--muted); font-size: 12px; padding: 6px 2px; }

  /* ---------- 관리자: 그룹 안 덱 순서 지정 ---------- */
  .order-assign { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .order-assign select {
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 400; color: var(--text);
    background: var(--panel2); border: 1px solid var(--border); cursor: pointer;
  }

  /* ---------- 덱 카드 (기존 시안 디자인) ---------- */
  .deck {
    max-width: 900px;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  :root[data-theme="light"] .deck { box-shadow: 0 4px 20px rgba(20,30,50,0.08); }
  .deck h1 { font-size: clamp(16px, 4.2vw, 22px); margin: 0 0 16px 4px; }
  .row { display: grid; gap: 10px; margin-bottom: 14px; }
  /* 캐릭터·장비·카드를 한 세트로 묶어 세로로 쌓고, 세트들을 한 줄에 나란히 배치.
     이렇게 하면 이 한 줄만 스크롤되므로(스크롤 컨테이너가 하나) 모바일에서 캐릭터/장비/카드가
     따로 놀지 않고 항상 같이 움직인다. */
  .row.charset { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); align-items: start; }
  .char-set { display: flex; flex-direction: column; gap: 6px; }
  .set-gear { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .row.pets { grid-template-columns: repeat(3, 0.72fr) 1.8fr; align-items: stretch; gap: 14px; }
  .row.pets > div:not(.position-box) { align-self: start; }

  .card-char { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-char img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
  .card-char .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.6vw, 13px); padding: 6px 0; font-weight: 400; }
  .card-char .badge {
    position: absolute; top: 6px; right: 6px; min-width: 22px; height: 20px; padding: 0 7px;
    border-radius: 6px; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 400; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .badge-front { background: linear-gradient(135deg, #e8636c, #c93540); }
  .badge-mid   { background: linear-gradient(135deg, #f0c96a, #cf9a2a); }
  .badge-back  { background: linear-gradient(135deg, #5cb0ea, #2f80c9); }

  .gear-cell { position: relative; text-align: center; }
  .gear-cell img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: var(--panel2); border-radius: 8px; border: 1px solid var(--border); padding: 6px; }

  .card-skill { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .card-skill img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 50%; display: block; }
  .card-skill .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.4vw, 12px); padding: 5px 0; }

  .pet-card { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); background: var(--panel2); }
  .pet-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 22%; display: block; }
  .pet-card .name { background: #000; color: #fff; text-align: center; font-size: clamp(10px, 2.4vw, 12px); padding: 5px 0; }
  .pet-pos { text-align: center; font-size: 13px; color: var(--gold); margin-bottom: 4px; }
  /* 라이트 모드에서는 검정 바탕에 흰 글씨가 다른 곳(밝은 배경)이랑 안 어울려서, 흰 바탕에
     검은 글씨로 뒤집어서 나머지 화면과 톤을 맞춘다. */
  :root[data-theme="light"] .card-char .name,
  :root[data-theme="light"] .card-skill .name,
  :root[data-theme="light"] .pet-card .name {
    background: var(--panel);
    color: var(--text);
    border-top: 1px solid var(--border);
  }

  .position-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; height: 100%; }
  .position-box .headers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; flex: 0 0 auto; }
  .position-box .headers div { text-align: center; font-size: 12px; font-weight: 400; background: #2c3040; border-radius: 8px; padding: 5px 0; color: var(--text); }
  :root[data-theme="light"] .position-box .headers div { background: #e4e9f1; }
  .position-box .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1 1 auto; min-height: 0; }
  .position-col { display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; }
  .position-col.single { justify-content: center; }
  .position-col .slot { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .position-col.single .slot { flex: 0 0 auto; height: calc(50% - 3px); }
  .position-col img { width: 100%; flex: 1 1 auto; min-height: 0; border-radius: 8px; object-fit: cover; object-position: 50% 22%; border: 1px solid var(--border); }
  .position-col .pname { font-size: 11px; text-align: center; color: var(--muted); margin-top: 3px; flex: 0 0 auto; }

  .timeline { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .timeline-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  /* 타임라인/주의사항 글씨 크기 조절: 예전엔 상단바에 있었는데, 조절 → 스크롤해서 확인이 불편하다는
     의견이 있어서 각 영역(타임라인/주의사항) 바로 옆으로 옮기고, 두 영역을 따로 조절할 수 있게 했다. */
  .font-adjust-inline { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 400; }
  .font-adjust-inline input { width: 42px; padding: 2px 4px; font-size: 11px; }
  .font-adjust-inline button { padding: 2px 8px; font-size: 10.5px; }
  .cycle { margin-bottom: 8px; }
  .cycle:last-of-type { margin-bottom: 0; }
  .cycle-label { display: inline-block; font-size: 12px; font-weight: 400; color: #000; background: var(--gold); border-radius: 5px; padding: 2px 8px; }
  /* 한 사이클의 스텝들은 줄바꿈으로 겹치듯 쌓이지 않고 항상 한 줄에 나오도록 한다.
     화면이 좁으면 칸 너비/간격을 줄여서 최대한 맞추고, 그래도 안 들어가면 가로 스크롤로 넘긴다.
     1사이클/2사이클을 같이 보는 경우가 많아서(모바일에서 게임 위에 창으로 띄워놓고 봄) 세로/가로
     간격을 최대한 타이트하게 유지한다. */
  /* overflow-x:auto를 주면 overflow-y도 같이 스크롤 박스가 되면서, 번호 배지(.step-num)가
     top:-4px로 위로 살짝 튀어나온 부분이 위쪽에서 잘려 반원처럼 보이는 문제가 있었다.
     padding-top으로 여유 공간을 줘서 배지가 안 잘리게 한다. */
  .timeline-row { display: flex; align-items: flex-start; gap: clamp(1px, 0.6vw, 3px); flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-top: 7px; padding-bottom: 2px; }
  .step { display: flex; flex-direction: column; align-items: center; width: clamp(58px, 15vw, 96px); flex: 0 0 auto; position: relative; }
  .step-num { position: absolute; top: -4px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #000; font-size: 10px; font-weight: 400; display: flex; align-items: center; justify-content: center; }
  .step img { width: clamp(38px, 10vw, 54px); height: clamp(38px, 10vw, 54px); border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 2px solid var(--border); }
  .step-name { font-size: clamp(calc(11px + var(--font-adjust-tl)), 2.7vw, calc(13.5px + var(--font-adjust-tl))); margin-top: 2px; text-align: center; color: var(--text); }
  .step-time-wrap { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 1px; }
  .step-time-wrap .step-time { margin-top: 0; }
  .step-time { font-size: clamp(calc(13px + var(--font-adjust-tl)), 3.4vw, calc(17px + var(--font-adjust-tl))); font-weight: 400; text-align: center; color: var(--blue); }
  .step-time-clear { border: none; background: transparent; color: var(--muted); font-size: 11px; line-height: 1; padding: 0 1px; cursor: pointer; flex: 0 0 auto; }
  .step-time-clear:hover, .step-time-clear:active { color: var(--red); }
  /* 메모도 주의사항과 같은 이유로 가독성 위주 폰트(Pretendard)로 바꾼다. 타임라인 스텝에 속해 있으니
     크기 조절도 "타임라인" 쪽 변수를 같이 쓴다. */
  .step-memo { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: clamp(calc(12px + var(--font-adjust-tl)), 2.9vw, calc(15px + var(--font-adjust-tl))); margin-top: 3px; text-align: center; color: var(--muted); line-height: 1.25; word-break: keep-all; border-top: 1px dashed var(--border); padding-top: 3px; width: 100%; }
  .arrow { color: var(--muted); font-size: clamp(11px, 2.6vw, 14px); padding-top: 10px; flex: 0 0 auto; }
  .warn-list { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
  /* 주의사항은 눈에 잘 들어와야 해서, 둥글둥글한 장식용 폰트(Jua) 대신 획이 또렷한 Pretendard로
     따로 지정한다(다른 곳은 그대로 Jua를 씀 — 여기만 가독성 위주로 바꿔달라는 의견이 있었음). */
  .warn-item { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--gold); font-size: calc(14.5px + var(--font-adjust-warn)); font-weight: 400; line-height: 1.7; }
  .warn-item .tile-remove, .warn-list .add-btn.small { position: static; width: auto; height: auto; border-radius: 5px; padding: 1px 6px; font-size: 10px; margin-left: 6px; background: var(--red); vertical-align: middle; }
  .warn-list .add-btn.small { background: var(--panel2); color: var(--muted); margin-left: 0; }
  .warn-item .drag-handle { position: static; width: auto; height: auto; line-height: normal; border-radius: 5px; padding: 1px 6px; font-size: 10px; margin-left: 6px; background: var(--panel2); color: var(--muted); vertical-align: middle; }
  .note-tag { display: inline-block; background: #3a3020; color: var(--gold); font-size: 10px; border-radius: 4px; padding: 2px 6px; margin-bottom: 8px; }
  :root[data-theme="light"] .note-tag { background: #fbeecb; color: #8a6612; }

  .title-bar { position: relative; display: flex; align-items: center; min-height: 88px; border-radius: 12px; overflow: hidden; margin-bottom: 16px; background: var(--panel); }
  .title-boss { position: absolute; right: 0; top: 0; height: 100%; width: 720px; max-width: 78%; pointer-events: none; overflow: hidden; }
  .title-boss img {
    position: absolute; right: 0; top: 0; height: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; filter: saturate(1.05);
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 25%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.92) 70%, rgba(0,0,0,1) 88%);
  }
  .title-text { position: relative; z-index: 2; padding: 10px 4px 10px 16px; }
  .title-text h1 { margin: 0 0 8px 0; }


  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }

  /* ---------- 관리자 편집 폼 ---------- */
  .small-btn { padding: 4px 10px; font-size: 11.5px; }
  .danger { background: var(--red); color: #fff; border: none; }
  .primary { background: var(--blue); color: #fff; border: none; font-weight: 400; }
  .save-bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 0; margin-top: 16px; display: flex; align-items: center; gap: 10px; justify-content: flex-end; z-index: 5; }
  .save-bar #save-msg { margin-right: auto; }
  .msg { font-size: 12.5px; padding: 8px 0; }
  .msg.ok { color: #6bd08a; }
  .msg.err { color: var(--red); }

  /* ---- 관리자 인라인 편집 ---- */
  #admin-hint { max-width: 960px; margin: 0 auto 10px; font-size: 12px; color: var(--gold); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .deck.editing .card-char, .deck.editing .gear-cell, .deck.editing .card-skill, .deck.editing .pet-card, .deck.editing .step {
    outline: 1px dashed var(--border); outline-offset: 2px; cursor: pointer;
  }
  .tile-overlay { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; z-index: 1; }
  /* 스킬 타임라인 스텝의 캐릭터 클릭 영역: .step 전체(이름/시간/메모까지 포함)를 덮으면 안 되니
     .step img와 정확히 같은 크기로 맞춘다(48px 고정이면 img가 더 커지는 화면 폭에서 원 오른쪽/아래쪽이
     안 눌리는 문제가 있었다). */
  .tile-overlay.small { width: clamp(38px, 10vw, 54px); height: clamp(38px, 10vw, 54px); left: 50%; top: 0; transform: translateX(-50%); inset: auto; }
  .badge-select {
    position: absolute; top: 6px; right: 6px; z-index: 2; min-width: 22px; height: 20px;
    border: none; border-radius: 6px; font-size: 10.5px; font-weight: 400; padding: 0 3px;
    color: #fff; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.45); appearance: auto;
  }
  .badge-select.badge-front { background: linear-gradient(135deg, #e8636c, #c93540); }
  .badge-select.badge-mid   { background: linear-gradient(135deg, #f0c96a, #cf9a2a); }
  .badge-select.badge-back  { background: linear-gradient(135deg, #5cb0ea, #2f80c9); }
  /* 배지 select 자체는 흰 글씨(배지 디자인)지만, 펼쳐진 옵션 목록까지 흰 글씨면 안 보이므로
     옵션 목록만 따로 어두운 글씨/밝은 배경으로 지정 */
  .badge-select option { color: #111; background: #fff; }
  .tile-overlay option { color: #111; background: #fff; }
  .tile-overlay option[disabled] { color: #888; background: #eee; font-weight: 400; }
  .tile-remove { position: absolute; top: 8px; left: 8px; z-index: 2; width: 20px; height: 20px; line-height: 18px; padding: 0; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; cursor: pointer; }
  .step .tile-remove.small { top: -4px; right: -4px; left: auto; width: 16px; height: 16px; line-height: 14px; font-size: 11px; }
  .add-row { text-align: center; margin: -4px 0 14px; }
  .add-btn { background: var(--panel2); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .add-btn.small { padding: 3px 8px; font-size: 10.5px; align-self: center; margin-left: 4px; }
  .editable-text { outline: none; border-radius: 4px; }
  .editable-text:hover, .editable-text:focus { background: var(--panel2); }
  .editable-text:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .title-text h1.editable-text:empty:before { content: '덱 제목'; }
  .cycle-label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cycle-label-row .tile-remove { position: static; width: auto; height: auto; border-radius: 5px; padding: 2px 8px; font-size: 10.5px; background: var(--red); }
  .title-boss.editable { pointer-events: auto; cursor: pointer; }

  /* ---- 드래그로 순서/자리 바꾸기 (캐릭터 세트 / 펫 / 스킬 타임라인 스텝 공통) ---- */
  .drag-handle {
    position: absolute; bottom: 6px; right: 6px; z-index: 3; width: 22px; height: 20px; line-height: 18px;
    text-align: center; padding: 0; border-radius: 6px; border: none; background: rgba(0,0,0,0.55);
    color: #fff; font-size: 13px; cursor: grab; touch-action: none; user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  /* .step에서는 step-num(좌상단)·삭제버튼(우상단)과 겹치지 않도록 바로 오른쪽에 배치 */
  .drag-handle.small { top: -4px; left: 22px; bottom: auto; right: auto; width: 16px; height: 16px; line-height: 14px; font-size: 10px; }
  .drag-source { opacity: 0.3; }
  .drag-over { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
  .drag-ghost { position: fixed; pointer-events: none; z-index: 999; opacity: 0.9; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin: 0 !important; }

  /* ---------- 모바일 화면 ---------- */
  @media (max-width: 700px) {
    body { padding: 12px; }
    .topbar h1 { font-size: 16px; }
    .layout { flex-direction: column; gap: 12px; }
    .main { width: 100%; }
    .deck { padding: 14px 10px; border-radius: 12px; }
    .title-bar { min-height: 64px; }
    .title-boss { max-width: 65%; }

    /* 캐릭터+장비+카드가 "한 세트"로 묶여 있고, 모바일에서도 5명이 스크롤 없이 한 화면에 다 보이도록
       칸 너비를 화면 폭에 맞게 균등하게 줄인다(캐릭/장비/카드는 세로로 묶여 있어 항상 같이 움직임). */
    .row.charset {
      display: flex !important; flex-wrap: nowrap; overflow-x: visible;
      gap: 4px; padding-bottom: 0;
    }
    .char-set { flex: 1 1 0; min-width: 0; gap: 3px; }
    .set-gear { gap: 3px; }
    .gear-cell img { padding: 3px; }
    .card-char .badge { width: 16px; height: 16px; font-size: 10px; }

    /* 펫 3칸 + 배치 미리보기 박스는 좁은 화면에서도 계속 좌우로 나란히 두고, 그냥 다같이
       작아지게 한다 (세로로 쌓이면 오히려 더 길어져서 보기 불편하다는 피드백). */
    .row.pets { grid-template-columns: repeat(3, 0.62fr) 1.3fr; gap: 6px; }
    .position-box { padding: 6px; border-radius: 8px; }
    .position-box .headers { gap: 4px; margin-bottom: 4px; }
    .position-box .headers div { font-size: 9px; padding: 3px 0; border-radius: 5px; }
    .position-box .cols { gap: 4px; }
    .position-col { gap: 3px; }
    .position-col .pname { font-size: 8.5px; margin-top: 1px; }
    .pet-pos { font-size: 11px; margin-bottom: 2px; }
    .save-bar { flex-wrap: wrap; }
    .save-bar #save-msg { flex: 1 1 100%; margin-right: 0; }

    /* 스킬 타임라인: 한 사이클(스텝들)이 스크롤 없이 한 화면에 다 들어오도록,
       스텝/화살표가 화면 폭에 맞춰 균등하게 줄어들게 한다(개수가 몇 개든 항상 꽉 채워서 넘치지 않음).
       1/2사이클을 같이 보는 경우가 많아서 위아래 여백도 최대한 좁게 유지한다. */
    .timeline { padding: 8px 8px; margin-top: 8px; }
    .timeline-title { margin-bottom: 6px; }
    .cycle { margin-bottom: 6px; }
    .timeline-row { overflow-x: visible; gap: 1px; padding-top: 6px; padding-bottom: 0; }
    .step { width: auto; flex: 1 1 0; min-width: 0; }
    .step img { width: 78%; height: auto; aspect-ratio: 1/1; max-width: 44px; }
    .tile-overlay.small { width: 78%; height: auto; aspect-ratio: 1/1; max-width: 44px; }
    .step-name { font-size: calc(10.5px + var(--font-adjust-tl)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 1px; }
    .step-time { font-size: calc(13px + var(--font-adjust-tl)); margin-top: 0; }
    .step-memo { font-size: calc(11px + var(--font-adjust-tl)); overflow-wrap: break-word; margin-top: 2px; padding-top: 2px; }
    .arrow { flex: 0 0 auto; font-size: 9px; padding: 0 1px; padding-top: 8px; }
  }

  /* ---------- 이미지로 저장/공유할 때 강제로 좁은(모바일) 배치로 캡처 ----------
     위 @media (max-width:700px)는 "지금 이 화면(브라우저 창)"이 좁을 때만 적용되는데,
     PC의 넓은 창에서 "이미지로 저장"을 눌러도 카톡 등에서 보기 좋은 세로로 긴 비율이 나오게
     하려면 화면 크기와 상관없이 항상 이 스타일을 강제로 써야 한다. 그래서 캡처용으로 그리는
     화면 밖 사본에는 항상 .capture-narrow 클래스를 붙이고, 위 모바일 스타일을 그대로 복사해서
     "화면 폭"이 아니라 "이 클래스가 붙었는지"로 적용되게 만들었다(내용은 위 블록과 동일하게 유지). */
  .capture-narrow .deck { padding: 14px 10px; border-radius: 12px; }
  .capture-narrow .title-bar { min-height: 64px; }
  .capture-narrow .title-boss { max-width: 65%; }
  .capture-narrow .row.charset { display: flex !important; flex-wrap: nowrap; overflow-x: visible; gap: 4px; padding-bottom: 0; }
  .capture-narrow .char-set { flex: 1 1 0; min-width: 0; gap: 3px; }
  .capture-narrow .set-gear { gap: 3px; }
  .capture-narrow .gear-cell img { padding: 3px; }
  .capture-narrow .card-char .badge { width: 16px; height: 16px; font-size: 10px; }
  .capture-narrow .row.pets { grid-template-columns: repeat(3, 0.62fr) 1.3fr; gap: 6px; }
  .capture-narrow .position-box { padding: 6px; border-radius: 8px; }
  .capture-narrow .position-box .headers { gap: 4px; margin-bottom: 4px; }
  .capture-narrow .position-box .headers div { font-size: 9px; padding: 3px 0; border-radius: 5px; }
  .capture-narrow .position-box .cols { gap: 4px; }
  .capture-narrow .position-col { gap: 3px; }
  .capture-narrow .position-col .pname { font-size: 8.5px; margin-top: 1px; }
  .capture-narrow .pet-pos { font-size: 11px; margin-bottom: 2px; }
  .capture-narrow .timeline { padding: 8px 8px; margin-top: 8px; }
  .capture-narrow .timeline-title { margin-bottom: 6px; }
  .capture-narrow .cycle { margin-bottom: 6px; }
  .capture-narrow .timeline-row { overflow-x: visible; gap: 1px; padding-top: 6px; padding-bottom: 0; }
  .capture-narrow .step { width: auto; flex: 1 1 0; min-width: 0; }
  .capture-narrow .step img { width: 78%; height: auto; aspect-ratio: 1/1; max-width: 44px; }
  .capture-narrow .step-name { font-size: calc(10.5px + var(--font-adjust-tl)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 1px; }
  .capture-narrow .step-time { font-size: calc(13px + var(--font-adjust-tl)); margin-top: 0; }
  .capture-narrow .step-memo { font-size: calc(11px + var(--font-adjust-tl)); overflow-wrap: break-word; margin-top: 2px; padding-top: 2px; }
  .capture-narrow .arrow { flex: 0 0 auto; font-size: 9px; padding: 0 1px; padding-top: 8px; }
  /* html2canvas가 그라디언트 + 둥근 모서리 + box-shadow 조합을 캡처할 때
     배지 테두리가 각지게(사각형 티가 나게) 깨져 보이는 문제가 있어서,
     캡처본에서는 배지를 그라디언트 대신 단색으로 바꾸고 그림자도 빼서 깔끔하게 나오게 한다. */
  .capture-narrow .badge { box-shadow: none; }
  .capture-narrow .badge-front { background: #d6434c; }
  .capture-narrow .badge-mid   { background: #dba83a; }
  .capture-narrow .badge-back  { background: #4a95d6; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>가온누리 정보 모음</h2>
    <p>길드원 비밀번호를 입력해주세요</p>
    <input id="gate-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">입장하기</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="topbar">
  <h1>가온누리 덱 모음</h1>
  <div class="right">
    <button class="pill-btn active" data-theme-btn="dark" onclick="setTheme('dark')">다크</button>
    <button class="pill-btn" data-theme-btn="light" onclick="setTheme('light')">라이트</button>
    <button class="pill-btn" id="free-btn" onclick="onFreeBtn()">자유 덱</button>
    <button class="pill-btn" id="add-item-btn" style="display:none" onclick="openAddItemModal()">+ 새 항목 추가</button>
    <button class="pill-btn" id="lib-manage-btn" style="display:none" onclick="openLibraryManageModal()">목록 관리</button>
    <button class="pill-btn" id="admin-btn" onclick="onAdminBtn()">관리자 모드</button>
  </div>
</div>

<div class="layout">
  <div class="menu-row" id="menu-row-normal">
    <select id="sel-category" onchange="onCategoryChange_(this.value)"></select>
    <select id="sel-group" onchange="onGroupChange_(this.value)"><option>불러오는 중...</option></select>
    <select id="sel-deck" onchange="onDeckSelectChange_(this.value)"></select>
  </div>
  <div class="menu-row" id="free-menu-row" style="display:none">
    <select id="sel-free-deck" onchange="onFreeDeckSelectChange_(this.value)"></select>
  </div>
  <div class="main">
    <div id="admin-hint" style="display:none">관리자 모드: 이미지를 클릭하면 바로 바꿀 수 있고, 글자를 클릭하면 바로 고칠 수 있어요.</div>
    <div id="deck-toolbar" style="display:none;text-align:right;margin-bottom:8px">
      <button class="pill-btn" id="deck-save-btn" type="button" onclick="downloadDeckImage('save')">📷 저장</button>
      <button class="pill-btn" id="deck-share-btn" type="button" onclick="downloadDeckImage('share')">💬 카톡 공유</button>
    </div>
    <div id="viewer"><div class="deck"><div class="empty">위쪽 메뉴에서 덱을 선택하세요</div></div></div>
    <div id="admin-bar" class="save-bar" style="display:none">
      <span id="save-msg" class="msg"></span>
      <button class="small-btn danger" id="admin-delete-btn" type="button">이 덱 삭제</button>
      <button class="small-btn" id="admin-revert-btn" type="button">되돌리기</button>
      <button class="pill-btn active" id="admin-save-btn" type="button">저장</button>
    </div>
  </div>
</div>

<div id="add-item-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>새 캐릭터/카드/장비/펫 추가</h3>
    <label class="modal-field">종류
      <select id="add-item-kind">
        <option value="character">캐릭터 (초상화)</option>
        <option value="card">카드</option>
        <option value="weapon">장비 - 무기</option>
        <option value="armor">장비 - 갑옷</option>
        <option value="item">장비 - 장신구</option>
        <option value="rune">장비 - 룬</option>
        <option value="pet">펫</option>
      </select>
    </label>
    <label class="modal-field">이름
      <input type="text" id="add-item-name" placeholder="예: 염제">
    </label>
    <label class="modal-field">이미지 파일
      <input type="file" id="add-item-file" accept="image/*">
    </label>
    <div id="add-item-msg" class="msg"></div>
    <div class="modal-actions">
      <button type="button" class="small-btn" onclick="closeAddItemModal()">취소</button>
      <button type="button" class="pill-btn active" id="add-item-submit-btn" onclick="submitAddItem()">추가</button>
    </div>
  </div>
</div>

<div id="lib-manage-modal" class="modal-overlay" style="display:none">
  <div class="modal-box wide">
    <h3>목록 관리</h3>
    <label class="modal-field">종류
      <select id="lib-manage-category" onchange="loadLibraryCategory_(this.value)">
        <option value="character">캐릭터 (주요/나머지)</option>
        <option value="card">카드 (주요/나머지)</option>
        <option value="pet">펫 (주요/나머지)</option>
        <option value="weapon">장비 - 무기 (직업별)</option>
        <option value="armor">장비 - 갑옷 (직업별)</option>
        <option value="item">장비 - 장신구 (직업별)</option>
        <option value="rune">장비 - 룬 (직업별)</option>
      </select>
    </label>
    <div class="lib-add-row">
      <select id="lib-add-select"><option value="">추가할 항목 선택...</option></select>
      <button type="button" class="small-btn" onclick="addLibraryEntry_()">추가</button>
    </div>
    <div class="lib-cols" id="lib-cols-container"></div>
    <div id="lib-manage-msg" class="msg"></div>
    <div class="modal-actions">
      <button type="button" class="small-btn" onclick="closeLibraryManageModal()">닫기</button>
      <button type="button" class="pill-btn active" id="lib-manage-save-btn" onclick="saveLibraryList_()">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   설정: Apps Script 웹앱 배포 후 나오는 URL을 여기에 붙여넣으세요.
   예) https://script.google.com/macros/s/AKfycb.../exec
========================================================= */
var API_URL = "https://script.google.com/macros/s/AKfycbzlUzZRvtZuV0Y939_y49H6bxzeHaTOdg5kuHGUsJUbS7orzIbBRYaCRs8z9h78QnmcMQ/exec";

// "자유 사용": 관리자 권한 없이 길드원 누구나 만들고 고칠 수 있는 별도 공간. 레이드/아발론/대난투
// 카테고리 목록(CATEGORIES)에는 일부러 안 넣어서, 평소의 3단 드롭다운(카테고리→그룹→번호)에는
// 전혀 안 섞이고 완전히 별도의 화면(자유 덱 목록)에서만 다룬다.
var FREE_CATEGORY = '자유 사용';
var FREE_DECK_LIMIT = 20;
function isFreeDeck_(d) { return !!d && d.category === FREE_CATEGORY; }

var state = {
  viewPw: '',
  adminPw: '',
  isAdmin: false,

  castle: null, // 아발론 전용: 성 이름(엘다리아/엘아이아) 중 현재 선택된 것. null이면 성 선택 단계.
  group: null, // 카테고리(+성 이름) 안의 그룹(요일/타입/모드) 중 현재 선택된 것. null이면 그룹 선택 단계.

/* ---------- 유틸 ---------- */
// Apps Script 웹앱은 가끔(특히 한동안 안 쓰다가 처음 요청할 때) 실제로는 멀쩡한데도
// 응답 콜백을 한 번씩 놓쳐서 일시적으로 실패하는 경우가 있다(사용자가 "잠깐 실패했다가
// 바로 다시 하니까 됐다"고 겪은 게 이 현상). 저장/추가처럼 다시 보내면 중복이 생길 수 있는
// POST 요청은 그대로 두고, 조회(GET)만 실패 시 잠깐 기다렸다가 한 번 더 자동으로 시도한다.
function fetchJsonWithRetry_(url, triesLeft) {
  if (triesLeft === undefined) triesLeft = 1;
  return fetch(url).then(function (r) { return r.json(); }).catch(function (err) {
    if (triesLeft <= 0) throw err;
    return new Promise(function (resolve) { setTimeout(resolve, 1200); })
      .then(function () { return fetchJsonWithRetry_(url, triesLeft - 1); });
  });
}

function api(action, params, method, body) {
  params = params || {};
  method = method || 'GET';
  var url = API_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params).forEach(function (k) { url += '&' + k + '=' + encodeURIComponent(params[k]); });
  if (method === 'GET') {
    return fetchJsonWithRetry_(url);
  }
  return fetch(url, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action }, body || {}))
  }).then(function (r) { return r.json(); });
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.themeBtn === t);
  });
  try { localStorage.setItem('gn_theme', t); } catch (e) {}
}

// 타임라인/주의사항 글씨 크기 — 서버(관리자가 정한 값)를 CSS 변수 두 개(타임라인용/주의사항용)로
// 각각 반영한다. 이 변수를 쓰는 CSS(.step-name/.step-time/.step-memo/.warn-item)는 화면 캡처
// (이미지로 저장/공유)도 같은 문서 안에서 그리기 때문에, 여기서 :root에만 한 번 반영해두면
// 스크린샷에도 자동으로 적용된다.
function applyFontAdjust_() {
  document.documentElement.style.setProperty('--font-adjust-tl', (state.fontAdjustTl || 0) + 'px');
  document.documentElement.style.setProperty('--font-adjust-warn', (state.fontAdjustWarn || 0) + 'px');
}

// key: 'tl'(타임라인) | 'warn'(주의사항). 컨트롤은 덱 화면 안(타임라인/주의사항 바로 옆)에 있어서
// 덱을 다시 그릴 때마다 새로 만들어지므로, 버튼/입력칸을 id가 아니라 인자로 직접 받는다.
function saveFontAdjust_(key, input, btn) {
  var v = Math.max(-10, Math.min(10, Math.round(Number(input.value) || 0)));
  input.value = v;
  if (btn) btn.disabled = true;
  api('setFontAdjust', {}, 'POST', { pw: state.adminPw, key: key, value: v }).then(function (res) {
    if (btn) btn.disabled = false;
    if (res.ok) {
      if (key === 'warn') state.fontAdjustWarn = res.fontAdjustWarn;
      else state.fontAdjustTl = res.fontAdjustTl;
      applyFontAdjust_();
    } else {
      alert('적용 실패: ' + (res.error || ''));
    }
  }).catch(function () {
    if (btn) btn.disabled = false;
    alert('적용 중 통신 오류가 발생했습니다.');
  });
}

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }

// 구글 드라이브 이미지(lh3.googleusercontent.com)가 가끔 일시적으로 로드 실패하는 경우가 있어서,
// 실패하면 잠깐 기다렸다가 주소는 그대로 두고(URL을 바꾸면 구글 쪽에서 이상하게 처리할 수 있어서) 다시 로드를 시도한다.
// 최대 2번까지만 재시도하고, 그래도 안 되면 그냥 깨진 이미지로 둔다(무한 재시도 방지).
function imgRetry_(img) {
  var tries = parseInt(img.dataset.retryCount || '0', 10);
  if (tries >= 2 || !img.src) return;
  img.dataset.retryCount = String(tries + 1);
  var src = img.src;
  setTimeout(function () {
    img.src = '';
    img.src = src;
  }, 700 * (tries + 1));
}

/* ---------- 로그인 ---------- */
function tryLogin() {
  var pw = document.getElementById('gate-pw').value;
  var errEl = document.getElementById('gate-err');
  errEl.textContent = '잠시 기다려주세요...';
  api('list', { pw: pw }).then(function (res) {
    if (res.ok) {
      errEl.textContent = '';
      state.viewPw = pw;
      try { localStorage.setItem('gn_view_pw', pw); } catch (e) {}
      document.getElementById('gate').style.display = 'none';
      state.decks = res.decks;
      state.fontAdjustTl = Number(res.fontAdjustTl) || 0;
      state.fontAdjustWarn = Number(res.fontAdjustWarn) || 0;
      applyFontAdjust_();
      renderDeckList();
      // 사용자가 아직 덱을 고르기 전인 지금부터 미리 캐릭터/펫 라이브러리를 받아둔다.
      // 이렇게 해두면 실제로 첫 덱을 클릭했을 때는 이미 다 받아져 있어서 덱 내용(get)만 기다리면 된다.
      loadLibraries().catch(function () {}); // 미리 불러오기 실패해도(통신 오류 등) 로그인 자체는 계속 진행
      var savedAdmin = null;
      try { savedAdmin = localStorage.getItem('gn_admin_pw'); } catch (e) {}
      if (savedAdmin) tryAdminLogin(savedAdmin, true);
    } else {
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
    }
  }).catch(function () {
    errEl.textContent = 'API_URL 설정을 확인해주세요.';
  });
}

function onAdminBtn() {
  if (state.isAdmin) {
    state.isAdmin = false;
    state.adminPw = '';
    try { localStorage.removeItem('gn_admin_pw'); } catch (e) {}
    document.getElementById('admin-btn').textContent = '관리자 모드';
    document.getElementById('admin-btn').classList.remove('admin-on');
    document.getElementById('add-item-btn').style.display = 'none';
    document.getElementById('lib-manage-btn').style.display = 'none';
    renderCurrentDeck();
    return;
  }
  var pw = prompt('관리자 비밀번호를 입력하세요');
  if (pw == null) return;
  tryAdminLogin(pw, false);
}

function tryAdminLogin(pw, silent) {
  var btn = document.getElementById('admin-btn');
  var prevText = btn.textContent;
  if (!silent) btn.textContent = '확인 중...';
  api('checkAdmin', { pw: pw }).then(function (res) {
    if (res.ok && res.isAdmin) {
      state.isAdmin = true;
      state.adminPw = pw;
      try { localStorage.setItem('gn_admin_pw', pw); } catch (e) {}
      document.getElementById('admin-btn').textContent = '관리자 모드 ON';
      document.getElementById('admin-btn').classList.add('admin-on');
      document.getElementById('add-item-btn').style.display = 'inline-block';
      document.getElementById('lib-manage-btn').style.display = 'inline-block';
      renderDeckList();
      loadLibraries().then(renderCurrentDeck);
    } else {
      if (!silent) {
        btn.textContent = prevText;
        alert('관리자 비밀번호가 올바르지 않습니다.');
      }
    }
  }).catch(function () {
    if (!silent) {
      btn.textContent = prevText;
      alert('통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    }
  });
}

/* ---------- 카테고리(레이드/아발론/대난투) → (아발론만 성 이름) → 그룹(요일/타입/모드) → 번호, 다단계 덱 선택 ----------
   - 레이드: 카테고리 → 요일(그룹) → 번호
   - 아발론: 카테고리 → 성 이름(엘다리아/엘아이아) → 타입(성문/보스, 그룹) → 번호
   - 대난투: 카테고리 → 이름(산양/흑랑/카우/묘족, 그룹) → 번호
*/
var CATEGORIES = ['레이드', '아발론', '대난투'];
// 카테고리별 그룹 순서(정렬 기준). 실제 덱에 있는 group 값만 이 순서대로 노출되고,
// 이 목록에 없는 group 값이 덱에 있으면 뒤쪽에 추가로 붙는다.
// 아발론의 group 값은 "엘다리아 성문"처럼 "성 이름 + 타입"이 공백으로 붙은 형태를 그대로 쓴다.
var GROUP_ORDER = {

  '대난투': ['산양', '흑랑', '카우', '묘족']
};
// 레이드 그룹(요일)은 드롭다운에 "보스 이름(요일)"로 보여준다. 값(월/화/...)은 그대로 두고 표시만 바꾼다.
var RAID_GROUP_LABEL = {
  '월': '주시자의 여왕(월)',
  '화': '아그네스(화)',
  '수': '예티(수)',
  '목': '독룡 파프니르(목)',
  '금': '전사장 칼레온(금)',
  '토(마법덱)': '염제 케이·마법덱(토)',
  '토(물리덱)': '염제 케이·물리덱(토)',
  '일': '메두사(일)'
};

// 요일/그룹별 기본 보스 이미지 (드라이브 "가온누리_안정이미지" 폴더). 덱에 bossIcon이 따로 지정돼
// 있지 않으면 이 기본값을 쓴다 — 매번 관리자 모드에서 직접 붙여넣지 않아도 됨.
function driveThumb_(id) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000'; }
var DEFAULT_BOSS_ICON = {
  '레이드|월': driveThumb_('19HV5E648yFLwsjLKzsL0zoRzbmnVoIo-'),       // 주시자의 여왕
  '레이드|화': driveThumb_('1GcDxc69_n7zWrVPytWTdS0_ddSVzaDA6'),       // 아그네스

  '레이드|토(마법덱)': driveThumb_('1VUJM4eXeDKTSl8vg-BbLEDBUjLE848aV'), // 염제 케이 (마법)

  '아발론|엘다리아 보스': driveThumb_('1ZgL7LMosmISivo0ZwbMbd7WTZLos57RN'), // 엘다리아.png
  '아발론|엘아이아 성문': driveThumb_('1DsRzaue5c2SXs2gV62RaK1O6IZnNzAPV'), // 엘아이아.png
  '아발론|엘아이아 보스': driveThumb_('1DsRzaue5c2SXs2gV62RaK1O6IZnNzAPV'), // 엘아이아.png

  '대난투|묘족': driveThumb_('1FLtrKXgP0LlXcnpmM6Wo7laI2LGTXG0Y')
};
function defaultBossIcon_(deck) {
  var key = String(deckCategory_(deck)).trim() + '|' + String(deckGroup_(deck)).trim();
  return DEFAULT_BOSS_ICON[key] || '';
}

function deckCategory_(d) { return d.category || CATEGORIES[0]; } // 카테고리 없는 예전 덱은 "레이드"로 취급
function deckGroup_(d) { return d.group || ''; } // 그룹 없는 예전 덱은 빈 그룹으로 취급
// 드롭다운에 보여줄 그룹 이름. 레이드는 "보스 이름(요일)"로, 나머지는 실제 값(그룹 값 자체가
// 이미 "엘다리아 성문"/"산양"처럼 설명이 되는 이름이라 그대로 보여준다.
function groupLabel_(cat, g) {
  if (cat === '레이드' && RAID_GROUP_LABEL[g]) return RAID_GROUP_LABEL[g];
  return g;
}

// 카테고리 안의 그룹 목록을 정해진 순서대로 구한다 (실제 덱에 있는 그룹만).
// 관리자는 예외: GROUP_ORDER에 정의는 돼 있지만 아직 덱이 하나도 없는 새 그룹(예: 새로 추가한
// 성/보스)도 미리 보여줘서, 그 그룹을 선택한 뒤 "+ 새 덱 만들기"로 처음 덱을 만들 수 있게 한다.
// (일반 길드원 화면에는 덱이 하나라도 있어야만 그 그룹이 보인다 — 빈 그룹이 보이면 혼란스러우니까.)
function groupsInCategory_(cat) {
  var decksInCat = state.decks.filter(function (d) { return deckCategory_(d) === cat; });
  var present = {};
  decksInCat.forEach(function (d) { if (deckGroup_(d)) present[deckGroup_(d)] = true; });
  var order = GROUP_ORDER[cat] || [];
  if (state.isAdmin) {
    var outAdmin = order.slice();
    Object.keys(present).forEach(function (g) { if (outAdmin.indexOf(g) === -1) outAdmin.push(g); });
    return outAdmin;
  }
  var out = order.filter(function (g) { return present[g]; });
  Object.keys(present).forEach(function (g) { if (out.indexOf(g) === -1) out.push(g); });
  return out;
}

// 같은 카테고리+그룹 안의 덱들을 "순서"(order) 기준으로 정렬한다. order를 아직 지정하지 않은
// (관리자가 순서를 바꾼 적 없는) 덱들은 전부 맨 뒤로 몰아넣되, 그들끼리는 원래 있던 순서 그대로
// 유지한다 — 그래서 "순서 바꾸기"를 한 번도 안 쓰면 예전과 똑같은 순서로 보인다.
function deckOrderVal_(d) {
  var n = parseFloat(d && d.order);
  return isFinite(n) ? n : 999999;
}
function decksInGroupSorted_(cat, group) {
  return state.decks
    .map(function (d, i) { return { d: d, i: i }; })
    .filter(function (x) { return deckCategory_(x.d) === cat && deckGroup_(x.d) === group; })
    .sort(function (a, b) {
      var oa = deckOrderVal_(a.d), ob = deckOrderVal_(b.d);
      return oa !== ob ? oa - ob : a.i - b.i;
    })
    .map(function (x) { return x.d; });
}
// 화면에 보여줄 덱 제목. 그룹이 있는 덱(레이드/아발론/대난투로 정리된 덱)은
// "그룹 표시명 + 순번"으로 자동으로 만들고, 그룹이 없는 예전 자유 형식 덱은 직접 적어둔 제목을 그대로 쓴다.
// "2(생존)"처럼 순번 뒤에 태그를 괄호로 붙여서 보여준다. 태그가 없으면 그냥 순번만.
function tagSuffix_(tag) { return tag ? '(' + tag + ')' : ''; }

function deckPositionLabel_(deck) {
  var cat = deckCategory_(deck), grp = deckGroup_(deck);
  if (!grp) return deck.title || '덱';
  var list = decksInGroupSorted_(cat, grp);
  var idx = list.findIndex(function (d) { return d.id === deck.id; });
  var pos = idx === -1 ? 1 : idx + 1;
  return groupLabel_(cat, grp) + ' ' + pos + tagSuffix_(deck.noteTag);
}

/* ---------- 3단 드롭다운 메뉴 (카테고리 → 그룹 → 번호) ---------- */
function renderCategorySelect_() {
  var el = document.getElementById('sel-category');
  el.innerHTML = CATEGORIES.map(function (cat) {
    return '<option value="' + esc(cat) + '"' + (cat === state.category ? ' selected' : '') + '>' + esc(cat) + '</option>';
  }).join('');
}

function onCategoryChange_(cat) {
  state.category = cat;
  state.group = null;
  // 지금 보고 있는 덱이 이 카테고리에 없으면 선택 해제
  var stillHere = state.decks.some(function (d) { return d.id === state.currentId && deckCategory_(d) === cat; });
  if (!stillHere) { state.currentId = null; state.currentDeck = null; }
  renderGroupSelect_();
  if (!stillHere) renderCurrentDeck();
}

function renderGroupSelect_() {
  var el = document.getElementById('sel-group');
  var groups = groupsInCategory_(state.category);
  if (!groups.length) {
    el.innerHTML = '<option value="">-</option>';
    el.disabled = true;
    renderDeckSelect_();
    return;
  }
  el.disabled = false;
  el.innerHTML = '<option value="" disabled' + (state.group ? '' : ' selected') + '>선택하세요</option>' +
    groups.map(function (g) {
      return '<option value="' + esc(g).replace(/"/g, '&quot;') + '"' + (g === state.group ? ' selected' : '') + '>' + esc(groupLabel_(state.category, g)) + '</option>';
    }).join('');
  renderDeckSelect_();
}

function onGroupChange_(g) {
  state.group = g;
  state.currentId = null;
  state.currentDeck = null;
  renderDeckSelect_();
  renderCurrentDeck();
}

function renderDeckSelect_() {
  var el = document.getElementById('sel-deck');
  var cat = state.category;
  var groups = groupsInCategory_(cat);
  var decksToShow;
  if (groups.length) {
    if (!state.group) {
      el.innerHTML = '<option value="">-</option>';
      el.disabled = true;
      return;
    }
    decksToShow = decksInGroupSorted_(cat, state.group);
  } else {
    decksToShow = decksInGroupSorted_(cat, ''); // 그룹 구분이 없는(예전) 덱들
  }
  el.disabled = false;
  // 지금 만들고 있는 새 덱은 아직 저장 전이라 decksToShow(=state.decks) 안에 없다 —
  // 목록엔 없지만 뭘 편집 중인지는 알 수 있게 드롭다운에 임시 항목을 하나 보여준다.
  var isDraft = state.currentId && !decksToShow.some(function (d) { return d.id === state.currentId; });
  var options = '<option value="" disabled' + (state.currentId ? '' : ' selected') + '>선택하세요</option>' +
    decksToShow.map(function (d, i) {
      return '<option value="' + esc(d.id) + '"' + (d.id === state.currentId ? ' selected' : '') + '>' + (i + 1) + esc(tagSuffix_(d.tag)) + '</option>';
    }).join('');
  if (isDraft) {
    options += '<option value="' + esc(state.currentId) + '" selected>새 덱 (저장 전)</option>';
  }
  if (state.isAdmin) {
    options += '<option value="__new__">+ 새 덱 만들기</option>';
  }
  el.innerHTML = (decksToShow.length || state.isAdmin || isDraft) ? options : '<option value="">등록된 덱이 없습니다</option>';
}

function onDeckSelectChange_(id) {
  if (id === '__new__') { newDeck(); return; }
  if (!id) return;
  selectDeck(id);
}

// 현재 보고 있는 덱을 같은 그룹(요일/성문 등) 안에서 newPosition번째 자리로 옮긴다.
// 그룹 안의 모든 덱 순서를 1..N으로 새로 매겨서 서버에 가볍게 반영한다(덱 내용 자체는 안 건드림).
function reorderDeck_(newPosition) {
  var deck = state.currentDeck;
  if (!deck) return;
  var cat = deckCategory_(deck), grp = deckGroup_(deck);
  if (!grp) return; // 그룹이 없는(예전) 덱은 순서 개념이 없음
  var list = decksInGroupSorted_(cat, grp);
  var curIdx = list.findIndex(function (d) { return d.id === state.currentId; });
  if (curIdx === -1) return;
  var moved = list.splice(curIdx, 1)[0];
  newPosition = Math.max(1, Math.min(newPosition, list.length + 1));
  list.splice(newPosition - 1, 0, moved);

  var updates = list.map(function (d, i) { return { id: d.id, order: i + 1 }; });
  updates.forEach(function (u) {
    var summary = state.decks.find(function (x) { return x.id === u.id; });
    if (summary) summary.order = u.order;
  });
  renderDeckSelect_();
  renderCurrentDeck();

  // 덱마다 따로 setOrder를 왕복으로 보내면 (1) 요청 수만큼 느려지고 (2) 왕복 사이사이에 다른
  // 관리자가 덱을 삭제/추가하면 서버가 행 번호를 다시 계산하면서 순서가 꼬일 수 있어서,
  // 한 번의 요청(setOrders)으로 묶어서 서버가 시트를 한 번만 읽고 한 번에 반영하게 한다.
  api('setOrders', {}, 'POST', { pw: state.adminPw, updates: updates }).then(function (res) {
    // api()는 통신 자체는 됐지만 서버가 { ok:false }로 응답한 경우(비번 만료, order 칼럼 없음 등)를
    // 성공으로 착각하고 그냥 지나쳐버려서, 화면엔 바뀐 순서가 보이는데 서버엔 반영이 안 되는 경우가
    // 있었다. res.ok를 직접 확인한다.
    if (!res || !res.ok) throw new Error('setOrders failed');
  }).catch(function () {
    alert('순서 저장 중 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.');
  });
}

// 예전 renderDeckList() 호출부와의 호환을 위해 유지: 3단 드롭다운을 전부 다시 그린다.
function renderDeckList() {
  renderCategorySelect_();
  renderGroupSelect_();
}

function selectDeck(id) {
  state.currentId = id;
  if (state.mode === 'free') { renderFreeDeckSelect_(); } else { renderDeckList(); }
  document.getElementById('viewer').innerHTML =
    '<div class="deck"><div class="loading-msg"><span class="spinner"></span>덱을 불러오는 중입니다...</div></div>';
  document.getElementById('admin-bar').style.display = 'none';
  document.getElementById('admin-hint').style.display = 'none';
  // 덱 내용(get)과 캐릭터/펫 라이브러리(bootstrap)는 서로 의존하지 않으므로 순서대로 기다리지 않고
  // 동시에 요청해서 더 느린 쪽 하나의 시간만 기다리면 되게 한다(전에는 get이 끝나야 라이브러리 요청을 시작했음).
  // 캐릭터/펫 라이브러리는 관리자 모드에서만이 아니라 일반 보기에서도 필요하다 —
  // 덱에 저장된 이미지가 오래된(만료된) 스냅샷일 때 최신 URL로 대체해서 보여주기 때문.
  // loadLibraries()는 이미 불러온 경우 바로 반환하므로 매번 다시 불러오지 않는다.
  Promise.all([
    api('get', { pw: state.viewPw, id: id }),
    // 라이브러리 쪽에서 통신 오류가 나도 "불러오기 실패"로 덱 전체를 못 보여주면 안 되니까
    // (덱 자체는 정상적으로 왔는데도 실패로 표시되는 문제가 있었음), 여기서 실패를 조용히 삼킨다.
    // 그래도 캐릭터/펫 이미지가 최신이 아닐 수 있는 정도지, 덱 자체는 정상적으로 보여줄 수 있다.
    loadLibraries().catch(function () {})
  ]).then(function (results) {
    var res = results[0];
    if (!res.ok) { document.getElementById('viewer').innerHTML = '<div class="deck"><div class="empty">불러오기 실패</div></div>'; return; }
    state.currentDeck = res.deck;
    renderCurrentDeck();
  }).catch(function () {
    document.getElementById('viewer').innerHTML = '<div class="deck"><div class="empty">불러오기 실패</div></div>';
  });
}

/* ---------- 현재 덱 그리기 (일반/관리자 공통) ---------- */
function renderCurrentDeck() {
  var viewer = document.getElementById('viewer');
  var deck = state.currentDeck;
  if (!deck) {
    viewer.innerHTML = '<div class="deck"><div class="empty">위쪽 메뉴에서 덱을 선택하세요</div></div>';
    document.getElementById('admin-bar').style.display = 'none';
    document.getElementById('admin-hint').style.display = 'none';
    document.getElementById('deck-toolbar').style.display = 'none';
    return;
  }
  // 자유 덱은 관리자가 아니어도 늘 편집 가능(그게 이 공간의 목적) — 관리자 모드일 때도 그대로 편집 가능.
  var free = state.mode === 'free' && isFreeDeck_(deck);
  var editable = !!state.isAdmin || free;
  viewer.innerHTML = renderDeckHtml(deck, editable);
  document.getElementById('deck-toolbar').style.display = 'block';
  if (state.isAdmin) wireFontAdjustControls_(viewer);
  if (editable) {
    wireAdminInline_(viewer, deck);
    document.getElementById('admin-bar').style.display = 'flex';
    document.getElementById('admin-hint').style.display = 'block';
    document.getElementById('admin-hint').textContent = free
      ? '자유 덱 편집 중: 이미지를 클릭하면 바로 바꿀 수 있고, 글자를 클릭하면 바로 고칠 수 있어요. 다른 길드원도 이 덱을 고칠 수 있어요.'
      : '관리자 모드: 이미지를 클릭하면 바로 바꿀 수 있고, 글자를 클릭하면 바로 고칠 수 있어요.';
    if (free) { wireFreeBar_(deck); } else { wireAdminBar_(deck); }
  } else {
    document.getElementById('admin-bar').style.display = 'none';
    document.getElementById('admin-hint').style.display = 'none';
  }
}

/* ---------- 덱을 이미지로 저장/공유 (단톡방 공유용) ---------- */
// 드라이브 썸네일 이미지는 브라우저에서 바로 캔버스에 그리면 CORS 때문에 빈 칸으로 나올 수 있어서,
// Apps Script 서버가 대신 받아온 base64 데이터로 바꿔치기한 뒤 캡처한다.
// 예전엔 이미지 하나마다 서버에 따로 요청(imageData)을 보내서, 이미지 개수만큼 exec/echo 왕복이
// 발생했다. 덱 불러올 때 bootstrap으로 묶었던 것처럼, 여기서도 이미지 URL을 한 번에 모아서
// 서버 한 번의 실행(imageDataBatch, UrlFetchApp.fetchAll)으로 다 받아오게 바꿔서 훨씬 빨라졌다.
//
// 다만 모바일 환경(특히 데이터 통신, 약한 와이파이)에서는 이 한 번의 요청 자체가 통째로
// 실패/타임아웃될 수 있는데, 그러면 예전과 달리 "이미지가 하나도 없이 틀만 나오는" 캡처가
// 나온다(요청 하나가 죽으면 이미지 전체가 다 같이 죽는 구조라서). 그래서
// 1) 배치 요청을 한 번 더 재시도하고, 2) 그래도 실패하면 예전 방식(이미지 하나씩 개별 요청)으로
// 다시 시도해서 최소한 되는 이미지라도 채워지게 한다.
function fetchImageDataUrlsBatch_(urls) {
  var needIdx = [];
  var needUrls = [];
  urls.forEach(function (u, i) {
    if (u && !/^data:/.test(u)) { needIdx.push(i); needUrls.push(u); }
  });
  var out = urls.slice();
  if (!needUrls.length) return Promise.resolve(out);

  function applyResults(results) {
    results.forEach(function (r, j) {
      var i = needIdx[j];
      out[i] = (r && r.ok && r.dataUrl) ? r.dataUrl : urls[i];
    });
  }
  function batchOnce() {
    return api('imageDataBatch', {}, 'POST', { pw: state.viewPw, urls: needUrls }).then(function (res) {
      if (!res || !res.ok || !Array.isArray(res.results)) throw new Error('batch_not_ok');
      applyResults(res.results);
    });
  }
  function perImageFallback() {
    return Promise.all(needUrls.map(function (u, j) {
      return api('imageData', { pw: state.viewPw, url: u }).then(function (r) {
        out[needIdx[j]] = (r && r.ok && r.dataUrl) ? r.dataUrl : urls[needIdx[j]];
      }).catch(function () { /* 이 이미지 하나만 원본 URL로 남겨두고 계속 진행 */ });
    }));
  }

  return batchOnce()
    .catch(batchOnce) // 1차 재시도
    .catch(perImageFallback) // 그래도 안 되면 개별 요청으로 최후 시도
    .then(function () { return out; });
}

// onload/onerror가 어떤 이유로든(브라우저 특이 동작, 극단적으로 느린 디코딩 등) 끝까지 안 불리면
// "이미지 생성 중..."에서 영원히 멈춰버리므로, 일정 시간 뒤엔 실패로 치고 그냥 진행하게 한다.
function imgLoadPromise_(img, timeoutMs) {
  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(); } }, timeoutMs || 5000);
    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve();
    }
    img.onload = finish;
    img.onerror = finish;
  });
}

function inlineImagesForCapture_(root) {
  var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
  var srcs = imgs.map(function (img) { return img.getAttribute('src') || ''; });
  return fetchImageDataUrlsBatch_(srcs).then(function (dataUrls) {
    var tasks = [];
    imgs.forEach(function (img, i) {
      var src = srcs[i];
      var dataUrl = dataUrls[i];
      if (!src || !dataUrl || dataUrl === src) return;
      var p = imgLoadPromise_(img);
      img.src = dataUrl;
      tasks.push(p);
    });
    return Promise.all(tasks);
  });
}

// html2canvas는 CSS의 aspect-ratio/flex로 계산되는 이미지 높이도, object-fit:cover로
// 잘라내는 것도 브라우저처럼 정확히 다시 그려주지 못한다(둘 다 알려진 한계). 그래서
// 실제 화면에서는 딱 맞게 잘려 보이던 카드/배치 이미지가, 캡처할 땐 박스 크기 계산이
// 틀어지거나 잘림 없이 원본이 눌려서 나온다.
// 그래서 캡처 직전에, "지금 화면에 보이는 그대로"를 캔버스로 직접 미리 잘라(object-fit:cover +
// object-position을 그대로 재현) 이미지 자체를 그 결과물로 바꿔치기하고, 박스 크기도 실제
// 계산된 픽셀 값으로 못박아버린다. 그러면 html2canvas는 이미 잘려있는 이미지를 정해진
// 크기의 박스에 그대로 채우기만 하면 되니까 더 이상 다시 계산할 게 없어서 어긋날 일이 없다.
function objectPositionFrac_(img) {
  var raw = (getComputedStyle(img).objectPosition || '50% 50%').split(' ');
  function frac(v) {
    v = (v || '50%').trim();
    return v.indexOf('%') !== -1 ? parseFloat(v) / 100 : 0.5;
  }
  return { x: frac(raw[0]), y: frac(raw[1]) };
}

function freezeCaptureSizes_(root) {
  // object-fit:cover로 화면 크기에 맞춰 잘려 보이는 것들(카드/배치/펫/스텝) — 잘라낸 결과를
  // 그대로 픽셀로 구워서(bake) 바꿔치기한다.
  // 주의: img.src를 새로 바꾼 뒤에도 브라우저가 그 새 이미지를 실제로 디코드해서 화면에
  // 반영하기까지는 약간의 시간이 걸린다(동기적으로 끝나지 않음). 이걸 기다리지 않고 바로
  // html2canvas를 돌리면 "아직 안 바뀐(원본) 이미지"가 object-fit:fill로 눌려서 찍혀버려서
  // 오히려 더 찌그러져 보이는 문제가 있었다 — 그래서 각 이미지의 onload를 Promise로 모아서
  // 전부 끝난 뒤에만 캡처를 시작하도록 고쳤다.
  var tasks = [];
  var coverSelectors = ['.card-char img', '.card-skill img', '.pet-card img', '.position-col img', '.step img'];
  Array.prototype.slice.call(root.querySelectorAll(coverSelectors.join(','))).forEach(function (img) {
    var rect = img.getBoundingClientRect();
    var targetW = Math.round(rect.width);
    var targetH = Math.round(rect.height);
    if (targetW > 0) img.style.width = targetW + 'px';
    if (targetH > 0) img.style.height = targetH + 'px';
    if (!targetW || !targetH || !img.naturalWidth || !img.naturalHeight) return;
    try {
      var natW = img.naturalWidth, natH = img.naturalHeight;
      var scale = Math.max(targetW / natW, targetH / natH);
      var srcW = targetW / scale;
      var srcH = targetH / scale;
      var pos = objectPositionFrac_(img);
      var srcX = Math.max(0, Math.min(natW - srcW, (natW - srcW) * pos.x));
      var srcY = Math.max(0, Math.min(natH - srcH, (natH - srcH) * pos.y));
      var outScale = 3; // 저장 시 html2canvas scale:3과 맞춰서 확대해도 흐릿하지 않게
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(targetW * outScale));
      canvas.height = Math.max(1, Math.round(targetH * outScale));
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);
      var dataUrl = canvas.toDataURL('image/png');
      img.style.objectFit = 'fill';
      var p = imgLoadPromise_(img);
      img.src = dataUrl;
      tasks.push(p);
    } catch (e) {
      // 캔버스 변환이 막히면(예: 원본이 데이터URL로 못 바뀐 경우) 그냥 원본 그대로 둔다.
    }
  });

  // object-fit:contain(장비 아이콘)은 잘리는 게 아니라 비율 유지한 채 안쪽에 들어가므로,
  // 박스 크기만 못박아주면 충분하다(이미지 자체를 바꾸지 않으니 로딩을 기다릴 필요 없음).
  Array.prototype.slice.call(root.querySelectorAll('.gear-cell img')).forEach(function (img) {
    var rect = img.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      img.style.width = rect.width + 'px';
      img.style.height = rect.height + 'px';
    }
  });

  return Promise.all(tasks);
}

function downloadDeckImage(mode) {
  var deck = state.currentDeck;
  if (!deck) { alert('저장할 덱이 없습니다.'); return; }
  if (typeof html2canvas !== 'function') { alert('이미지 저장 기능을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'); return; }

  var btnId = mode === 'share' ? 'deck-share-btn' : 'deck-save-btn';
  var btn = document.getElementById(btnId);
  var prevText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '이미지 생성 중...'; btn.disabled = true; }

  // 관리자 모드에서 열어놨더라도 선택박스/삭제버튼 같은 편집용 UI 없이 깨끗하게 캡처하기 위해,
  // 화면 밖에 읽기 전용(editable=false)으로 한 번 더 그려서 그걸 캡처한다.
  // 예전엔 900px 폭으로 캡처해서 카톡 등에서 보면 옆으로 너무 넙대대하게 보였는데,
  // 폭을 좁히고 .capture-narrow(모바일용 배치)를 강제로 씌워서 세로로 더 긴, 보기 편한 비율로 나오게 했다.
  var wrap = document.createElement('div');
  wrap.className = 'capture-narrow';
  wrap.style.position = 'fixed';
  wrap.style.left = '-99999px';
  wrap.style.top = '0';
  wrap.style.width = '480px';
  wrap.innerHTML = renderDeckHtml(deck, false);
  document.body.appendChild(wrap);
  var deckEl = wrap.querySelector('.deck');

  // 이 캡처용 사본의 <img>들은 화면(라이브 덱)과 똑같이 loading="lazy"와
  // onerror="imgRetry_(this)"를 그대로 물려받는다. 그런데 이 사본은 원래 화면 밖(left:-99999px)에
  // 있어서 브라우저가 lazy 로딩을 계속 미룰 수 있고(그러면 아래 onload/onerror Promise들이 영영
  // 안 끝나서 "이미지 생성 중..."에서 멈춰버림), imgRetry_가 예약해둔 재시도 타이머가 나중에
  // 실행되면서 이미 data URL/캔버스로 구운 이미지를 원래 URL로 되돌려버릴 수도 있다(700ms~1400ms
  // 뒤에 실행되는데, 그 사이에 아래 단계들이 이미지를 여러 번 바꿔치기하기 때문). 그래서 캡처
  // 사본에서는 처음부터 lazy와 재시도용 onerror를 떼어내서, 항상 즉시 로딩되고 아무도 나중에
  // src를 되돌리지 않게 한다.
  Array.prototype.slice.call(deckEl.querySelectorAll('img')).forEach(function (img) {
    img.loading = 'eager';
    img.removeAttribute('loading');
    img.onerror = null;
  });

  function cleanup() {
    if (wrap.parentNode) document.body.removeChild(wrap);
    if (btn) { btn.textContent = prevText; btn.disabled = false; }
  }

  var bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#171c27';
  inlineImagesForCapture_(deckEl).then(function () {
    return freezeCaptureSizes_(deckEl);
  }).then(function () {
    // Pretendard 웹폰트가 다 로딩되기 전에 캡처하면 저장 이미지만 기본 글꼴로 찍힐 수 있어서,
    // 캡처 직전에 폰트 로딩이 끝날 때까지 한 번 더 기다린다.
    return (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  }).then(function () {
    return html2canvas(deckEl, {
      backgroundColor: bg,
      // 확대해서 볼 때 깨져 보인다는 피드백이 있어서 배율을 3배로 올렸다.
      // (캡처 폭이 480px이라 3배로 찍어도 이미지 크기는 카톡 공유에 무리 없는 수준)
      scale: 3,
      useCORS: true
    });
  }).then(function (canvas) {
    cleanup();
    var filename = String(deck.title || '덱').replace(/[\/\\:*?"<>|]+/g, '_') + '.png';
    if (mode === 'share') {
      shareCanvasToKakao_(canvas, filename);
    } else {
      downloadCanvasFile_(canvas, filename);
    }
  }).catch(function (err) {
    cleanup();
    alert('이미지 생성에 실패했습니다. 잠시 후 다시 시도해주세요.\n(' + err + ')');
  });
}

// "저장": 실제 파일로 확실하게 저장한다.
// PC 중 크롬/엣지 계열(파일시스템 접근 API를 지원하는 브라우저)은 누를 때마다
// "다른 이름으로 저장" 창이 떠서 저장 위치(폴더)를 직접 고를 수 있다.
// 그 외(파이어폭스/사파리 PC, 안드로이드)는 브라우저의 기본 다운로드 폴더로 바로 저장되고,
// iOS 사파리는 다운로드 강제가 잘 안 먹어서 새 탭에 띄워 길게 눌러 저장하게 안내한다.
function downloadCanvasFile_(canvas, filename) {
  canvas.toBlob(function (blob) {
    if (!blob) { alert('이미지 생성에 실패했습니다.'); return; }
    var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (!isMobile && window.showSaveFilePicker) {
      window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'PNG 이미지', accept: { 'image/png': ['.png'] } }]
      }).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(blob).then(function () { return writable.close(); });
        });
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return; // 사용자가 저장 창을 취소함 — 그냥 종료
        fallbackAnchorDownload_(blob, filename); // 지원 안 하거나 실패하면 기본 다운로드로 대체
      });
      return;
    }
    if (isIOS) {
      openImageTabForSave_(URL.createObjectURL(blob), filename);
      return;
    }
    fallbackAnchorDownload_(blob, filename);
  }, 'image/png');
}

function fallbackAnchorDownload_(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}

// "카톡 공유": 모바일은 OS 공유시트(카카오톡 바로 선택 가능)를 띄우고,
// PC는 공유시트 대신 클립보드에 이미지를 복사해서 카카오톡 PC판에 Ctrl+V로 붙여넣게 한다.
// (PC 공유시트의 "복사" 기능이 기기에 따라 붙여넣기가 안 되는 문제가 있어 navigator.share를 쓰지 않는다.)
function shareCanvasToKakao_(canvas, filename) {
  canvas.toBlob(function (blob) {
    if (!blob) { alert('이미지 생성에 실패했습니다.'); return; }
    var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
      var file;
      try { file = new File([blob], filename, { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        // 이미지 생성(네트워크 요청+캡처)에 시간이 걸리다 보니, 공유 시트를 여는 시점엔
        // "사용자가 방금 눌렀다"는 유효 시간이 이미 지나 있어서 브라우저가 공유를 조용히
        // 거부하는 경우가 있다(NotAllowedError 등) — 이전엔 이걸 그냥 무시해버려서
        // "버튼만 원상복귀되고 아무 반응도 없는" 것처럼 보였다.
        // 이제는 실패하면(취소가 아닌 한) 카카오톡 공유 대신 이미지를 저장하고 안내한다.
        navigator.share({ files: [file], title: filename }).catch(function (err) {
          if (err && err.name === 'AbortError') return; // 사용자가 공유 시트에서 직접 취소함
          alert('공유 창을 열지 못했습니다. 대신 이미지를 저장했어요.\n카카오톡에서 사진 첨부로 보내주세요.');
          downloadCanvasFile_(canvas, filename);
        });
        return;
      }
      // 공유 API를 못 쓰는 구형/카카오톡 인앱 브라우저 등은 저장으로 대체.
      // (window.open()으로 새 탭을 여는 방식은 비동기 콜백 안에서는 팝업 차단에 걸려
      //  아무 반응 없이 막히는 경우가 많아서, 이미 잘 동작하는 "저장" 로직을 그대로 쓴다.)
      alert('이 브라우저에서는 바로 공유가 안 돼서 이미지를 저장했어요.\n카카오톡에서 사진 첨부로 보내주세요.');
      downloadCanvasFile_(canvas, filename);
      return;
    }
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        alert('이미지가 클립보드에 복사되었습니다.\n카카오톡 대화창에서 Ctrl+V로 붙여넣어 공유하세요.');
      }).catch(function () {
        alert('클립보드 복사에 실패했습니다. 대신 이미지를 저장한 뒤 카카오톡에 첨부해주세요.');
        downloadCanvasFile_(canvas, filename);
      });
    } else {
      alert('이 브라우저는 이미지 복사를 지원하지 않습니다. 대신 이미지를 저장한 뒤 카카오톡에 첨부해주세요.');
      downloadCanvasFile_(canvas, filename);
    }
  }, 'image/png');
}

// iOS Safari는 다운로드를 강제로 못 시키니 "길게 눌러서 저장"하도록 이미지를 보여줘야 하는데,
// 예전엔 window.open()으로 새 탭을 띄웠다. 그런데 이 함수는 항상 네트워크 요청+캡처를 거친
// 비동기 콜백 안에서 호출돼서, 그 시점엔 이미 "사용자가 방금 눌렀다"는 유효 시간이 지나있는
// 경우가 많아 팝업 차단에 걸려 아무 반응도 없이 막히곤 했다(카카오톡 공유가 똑같은 이유로
// 조용히 실패했던 것과 같은 원인). 새 창을 띄우는 대신, 지금 보고 있는 페이지 위에 오버레이로
// 이미지를 바로 띄우면 팝업 차단의 대상이 아니라서 이 문제를 완전히 피할 수 있다.
function openImageTabForSave_(url, filename) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#111;display:flex;' +
    'flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;';
  var hint = document.createElement('p');
  hint.textContent = '이미지를 길게 눌러서 저장하세요';
  hint.style.cssText = 'color:#fff;font-size:14px;margin:0 0 12px;text-align:center;';
  var img = document.createElement('img');
  img.src = url;
  img.alt = filename || '덱 이미지';
  img.style.cssText = 'max-width:100%;max-height:75vh;border-radius:8px;';
  var closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.textContent = '닫기';
  closeBtn.style.cssText = 'margin-top:16px;padding:9px 20px;border-radius:20px;border:none;' +
    'background:#333;color:#fff;font-size:13px;cursor:pointer;';
  function close() {
    if (overlay.parentNode) document.body.removeChild(overlay);
    URL.revokeObjectURL(url);
  }
  closeBtn.onclick = close;
  overlay.appendChild(hint);
  overlay.appendChild(img);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);
}

/* =========================================================
   덱 렌더러 (시안 디자인 그대로, 데이터 기반)
========================================================= */
var COL_ORDER = { '후열': 0, '중열': 1, '전열': 2 };
var COL_BADGE = { '후열': 'badge-back', '중열': 'badge-mid', '전열': 'badge-front' };

// 타이틀 바 그라데이션 색은 보스 속성에 맞춰 자동으로 정해진다 (보스 이미지 자체에 속성이 보이니
// 뱃지 아이콘은 따로 안 그림 — 예전엔 클릭해서 고르는 뱃지가 있었는데 클릭하면 이미지가 밀려
// 잘리는 문제가 있어서 제거했음. 요일/그룹별 기본 속성만 유지).
var ELEMENT_TINT = {
  thunder: '43,125,146',
  fire: '201,53,64',
  water: '47,128,201',
  nature: '47,158,106',
  radiance: '207,154,42',
  divine: '170,178,190',
  chaos: '104,66,160'
};
// 요일/그룹별 기본 속성. 레이드는 요일마다, 대난투는 캐릭터마다 정해져 있고
// 아발론은 속성 구분이 없어서 비워둔다(중립 회색 유지).
var DEFAULT_ELEMENT = {
  '레이드|월': 'thunder',   // 주시자의 여왕
  '레이드|화': 'fire',       // 아그네스
  '레이드|수': 'water',      // 예티
  '레이드|목': 'nature',     // 독룡 파프니르
  '레이드|금': 'radiance',   // 전사장 칼레온
  '레이드|토(마법덱)': 'divine', // 염제 케이
  '레이드|토(물리덱)': 'divine', // 염제 케이
  '레이드|일': 'chaos',      // 메두사
  '대난투|묘족': 'water',
  '대난투|산양': 'radiance',
  '대난투|카우': 'fire',
  '대난투|흑랑': 'thunder'
};
function groupKey_(deck) { return String(deckCategory_(deck)).trim() + '|' + String(deckGroup_(deck)).trim(); }
function deckElement_(deck) { return DEFAULT_ELEMENT[groupKey_(deck)] || ''; }
function bossTint_(deck) { return ELEMENT_TINT[deckElement_(deck)] || '92,100,118'; }

function sortedCharsForRow(characters) {
  // 상단 카드/장비/스킬카드 행 순서: 후열→중열→전열, 같은 열이면 slot2가 slot1보다 왼쪽(즉 slot 내림차순)
  return characters.slice().sort(function (a, b) {
    var ca = COL_ORDER[a.col], cb = COL_ORDER[b.col];
    if (ca !== cb) return ca - cb;
    return b.slot - a.slot;
  });
}

var POS_OPTIONS = [
  ['전열:1', '전열1'], ['전열:2', '전열2'],
  ['중열:1', '중열1'], ['중열:2', '중열2'],
  ['후열:1', '후열1'], ['후열:2', '후열2']
];
function posOptionsHtml_(col, slot) {
  var cur = col + ':' + slot;
  return POS_OPTIONS.map(function (p) {
    return '<option value="' + p[0] + '"' + (p[0] === cur ? ' selected' : '') + '>' + p[1] + '</option>';
  }).join('');
}

// deck: 덱 데이터. editable: true면 이미지 클릭→드롭다운 교체, 글자 클릭→직접 수정이 가능한 관리자용 마크업을 함께 그린다.
// 관리자 전용 글씨 크기 조절 컨트롤(타임라인/주의사항 각각). key: 'tl' | 'warn'.
// 전역(모두 공통) 설정이라 덱마다 값이 다르지 않고, 항상 state.fontAdjustTl/fontAdjustWarn을 쓴다.
function fontAdjustControlHtml_(key, label) {
  var val = key === 'warn' ? (state.fontAdjustWarn || 0) : (state.fontAdjustTl || 0);
  return '<span class="font-adjust-inline">' + esc(label) +
    '<input type="number" min="-10" max="10" step="1" value="' + val + '" data-font-adjust-input="' + key + '">' +
    '<button type="button" class="add-btn small" data-font-adjust-save="' + key + '">적용</button></span>';
}

function wireFontAdjustControls_(container) {
  container.querySelectorAll('[data-font-adjust-save]').forEach(function (btn) {
    btn.onclick = function () {
      var key = btn.getAttribute('data-font-adjust-save');
      var input = container.querySelector('[data-font-adjust-input="' + key + '"]');
      if (input) saveFontAdjust_(key, input, btn);
    };
  });
}

function renderDeckHtml(deck, editable) {
  var chars = sortedCharsForRow(deck.characters || []);

  // 캐릭터·장비·카드를 한 세트로 묶어서 세로 한 칸(.char-set)에 그린다.
  // (예전에는 캐릭터/장비/카드가 각각 따로 된 가로줄이라 모바일에서 셋이 따로 스크롤됐음 —
  //  이제 스크롤 컨테이너가 하나뿐이라 항상 같이 움직인다.)
  var charSetsHtml = chars.map(function (c) {
    var idx = (deck.characters || []).indexOf(c);
    var badge = editable
      ? '<select class="badge-select ' + COL_BADGE[c.col] + '" data-edit-pos="' + idx + '">' + posOptionsHtml_(c.col, c.slot) + '</select>'
      : '<div class="badge ' + COL_BADGE[c.col] + '">' + esc(c.slot) + '</div>';
    var charOverlay = editable ? '<select class="tile-overlay" data-edit-char="' + idx + '">' + optionsHtml_(state.characters, c.name) + '</select>' : '';
    var removeBtn = editable ? '<button type="button" class="tile-remove" data-remove-char="' + idx + '" title="캐릭터 삭제">×</button>' : '';
    var dragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="set" title="드래그해서 이 세트(캐릭터·장비·카드)를 다른 자리와 바꾸기">⠿</button>' : '';
    var charTile = '<div class="card-char' + (editable ? ' editable' : '') + '"><img src="' + esc(livePortrait_(c.name, c.portrait)) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)">' +
      badge + '<div class="name">' + esc(c.name) + '</div>' + charOverlay + removeBtn + dragHandle + '</div>';

    // 장비 드롭다운을 이 캐릭터의 직업(기사/법사/힐러/사수)에 맞는 것만 보여주기 위해 직업을 미리 찾아둔다.
    var charLib = findChar_(c.name);
    var role = charLib && charLib.role;
    var gearGrid = '<div class="set-gear">' +
      gearCell_(c.weapon, idx, 'weapon', editable, role) + gearCell_(c.armor, idx, 'armor', editable, role) +
      gearCell_(c.item, idx, 'item', editable, role) + gearCell_(c.rune, idx, 'rune', editable, role) +
      '</div>';

    // 카드는 캐릭터와 완전히 독립적으로 고를 수 있다 (자기 카드가 아닌 다른 카드를 쓰는 경우가 더 많음).
    // 아직 카드가 따로 지정되지 않은 기존 덱은 캐릭터 이름/이미지를 그대로 보여준다(예전 방식과 호환).
    // 이름 표시는 "~카드"라는 말 없이 이름만 보여준다.
    var cardName = (c.card && c.card.name) || c.name;
    // 캐릭터 초상화/펫과 마찬가지로, 덱에 저장된 카드 이미지는 저장 시점 스냅샷이라 오래되면
    // 깨질 수 있다. 라이브러리에 같은 이름이 있으면 항상 최신 URL을 우선 쓴다.
    var cardImg = liveCardImg_(cardName, (c.card && c.card.img) || '');
    var cardOverlay = editable ? '<select class="tile-overlay" data-edit-card="' + idx + '">' + optionsHtml_(state.cards, cardName, stripCardWord_) + '</select>' : '';
    // 카드는 캐릭터 세트 손잡이와 별개로, 카드 칸 자체에 손잡이를 하나 더 둬서
    // "카드만" 단독으로 다른 자리 카드와 맞바꿀 수 있게 한다(캐릭터/장비는 그대로 두고 카드만 이동).
    var cardDragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="card" title="드래그해서 이 카드만 다른 자리 카드와 바꾸기">⠿</button>' : '';
    var cardTile = '<div class="card-skill' + (editable ? ' editable' : '') + '"' + (editable ? ' data-drag-card="' + idx + '"' : '') + '><img src="' + esc(cardImg) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)"><div class="name">' + esc(stripCardWord_(cardName)) + '</div>' + cardOverlay + cardDragHandle + '</div>';

    return '<div class="char-set"' + (editable ? ' data-drag-set="' + idx + '"' : '') + '>' + charTile + gearGrid + cardTile + '</div>';
  }).join('');

  var pets = deck.pets || [];
  var petOrder = { '후열': 0, '중열': 1, '전열': 2 };
  var posList = editable ? ['후열', '중열', '전열'] : pets.slice().sort(function (a, b) { return petOrder[a.pos] - petOrder[b.pos]; }).map(function (p) { return p.pos; });
  var petsHtml = posList.map(function (pos) {
    var p = pets.find(function (x) { return x.pos === pos; }) || { pos: pos, name: '', img: '' };
    var overlay = editable ? '<select class="tile-overlay" data-edit-pet="' + pos + '">' + optionsHtml_(state.pets, p.name) + '</select>' : '';
    var dragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="pet" title="드래그해서 자리 바꾸기">⠿</button>' : '';
    return '<div><div class="pet-pos">' + esc(pos) + '</div>' +
      '<div class="pet-card' + (editable ? ' editable' : '') + '"' + (editable ? ' data-drag-pet="' + esc(pos) + '"' : '') + '><img src="' + esc(livePetImg_(p.name, p.img)) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)"><div class="name">' + esc(p.name) + '</div>' + overlay + dragHandle + '</div></div>';
  }).join('');

  // position box: 컬럼별 그룹핑, slot 오름차순 (1 위 / 2 아래) — 배치 미리보기, 읽기 전용
  var byCol = { '후열': [], '중열': [], '전열': [] };
  chars.forEach(function (c) { byCol[c.col].push(c); });
  Object.keys(byCol).forEach(function (k) { byCol[k].sort(function (a, b) { return a.slot - b.slot; }); });
  function posColHtml(col) {
    var arr = byCol[col];
    var single = arr.length <= 1 ? ' single' : '';
    var slots = arr.map(function (c) {
      return '<div class="slot"><img src="' + esc(livePortrait_(c.name, c.portrait)) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)"><div class="pname">' + esc(c.name) + '</div></div>';
    }).join('');
    return '<div class="position-col' + single + '">' + slots + '</div>';
  }
  var positionBoxHtml = '<div class="position-box"><div class="headers"><div>후열</div><div>중열</div><div>전열</div></div>' +
    '<div class="cols">' + posColHtml('후열') + posColHtml('중열') + posColHtml('전열') + '</div></div>';

  // 스킬 타임라인에는 이 덱에 실제로 들어있는 5명(위쪽 캐릭터 줄)만 후보로 보여준다.
  // 다른 캐릭터가 타임라인에 들어갈 일은 없으므로 전체 라이브러리 대신 이 목록만 쓴다.
  var deckCharOptions = chars.filter(function (c) { return c.name; }).map(function (c) { return { name: c.name }; });

  var timelineHtml = '';
  if (editable || (deck.timeline && deck.timeline.cycles && deck.timeline.cycles.length)) {
    var cycles = (deck.timeline && deck.timeline.cycles) || [];
    var cyclesHtml = cycles.map(function (cy, ci) {
      var stepsHtml = cy.steps.map(function (s, si) {
        var isLast = si === cy.steps.length - 1;
        var arrow = (!isLast || editable) ? '<div class="arrow">→</div>' : '';
        var charOverlay = editable ? '<select class="tile-overlay small" data-edit-step="' + ci + ':' + si + '">' + optionsHtml_(deckCharOptions, s.name) + '</select>' : '';
        // 시간 칸 하나만 따로 지울 수 있게, 값이 있을 때만 옆에 작은 × 버튼을 보여준다
        // ("시간 전체 지우기"는 사이클 전체를 다 비우는 거라 특정 캐릭터 하나만 고칠 땐 과함).
        var tagClearBtn = (editable && s.tag) ? '<button type="button" class="step-time-clear" data-clear-step-time="' + ci + ':' + si + '" title="이 시간만 지우기">×</button>' : '';
        var tagHtml = editable
          ? '<div class="step-time-wrap"><div class="step-time editable-text" contenteditable="true" data-step-field="tag:' + ci + ':' + si + '" data-placeholder="시간">' + esc(s.tag) + '</div>' + tagClearBtn + '</div>'
          : (s.tag ? '<div class="step-time">' + esc(s.tag) + '</div>' : '');
        var memoHtml = editable
          ? '<div class="step-memo editable-text" contenteditable="true" data-step-field="memo:' + ci + ':' + si + '" data-placeholder="메모">' + esc(s.memo) + '</div>'
          : (s.memo ? '<div class="step-memo">' + esc(s.memo) + '</div>' : '');
        var removeBtn = editable ? '<button type="button" class="tile-remove small" data-remove-step="' + ci + ':' + si + '" title="스텝 삭제">×</button>' : '';
        var dragHandle = editable ? '<button type="button" class="drag-handle small" data-drag-handle="step" title="드래그해서 순서 바꾸기">⠿</button>' : '';
        return '<div class="step' + (editable ? ' editable' : '') + '"' + (editable ? ' data-drag-step="' + ci + ':' + si + '"' : '') + '><div class="step-num">' + (si + 1) + '</div>' +
          '<img src="' + esc(livePortrait_(s.name, s.img)) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)"><div class="step-name">' + esc(s.name) + '</div>' +
          tagHtml + memoHtml + charOverlay + removeBtn + dragHandle +
          '</div>' + arrow;
      }).join('');
      var addStepBtn = editable ? '<button type="button" class="add-btn small" data-add-step="' + ci + '">+ 스텝 추가</button>' : '';
      var cycleLabel = editable
        ? '<span class="cycle-label editable-text" contenteditable="true" data-cycle-field="' + ci + '">' + esc(cy.label) + '</span><button type="button" class="tile-remove small" data-remove-cycle="' + ci + '" title="사이클 삭제">사이클 삭제</button>'
        : '<div class="cycle-label">' + esc(cy.label) + '</div>';
      return '<div class="cycle"><div class="cycle-label-row">' + cycleLabel + '</div><div class="timeline-row">' + stepsHtml + addStepBtn + '</div></div>';
    }).join('');
    var addCycleBtn = editable ? '<button type="button" class="add-btn" data-add-cycle>+ 사이클 추가</button>' : '';
    // 캐릭터/순서가 자주 바뀌어서 이미 적어둔 시간을 전부 지우고 다시 적어야 하는 경우가 많아,
    // 한 칸씩 지우지 않고 모든 사이클의 시간을 한 번에 비우는 버튼을 같이 둔다.
    var clearTimesBtn = editable ? '<button type="button" class="add-btn small" data-clear-times style="margin-left:8px;">시간 전체 지우기</button>' : '';
    // 글씨 크기 조절(관리자 전용, 전체 공통 설정)은 예전엔 상단바에 있었는데, 조절하고 나서
    // 다시 아래로 스크롤해서 확인해야 해 불편하다는 의견이 있어서 타임라인/주의사항 바로 옆으로 옮겼다.
    var tlFontAdjustHtml = state.isAdmin ? fontAdjustControlHtml_('tl', '글씨 크기') : '';
    timelineHtml = '<div class="timeline"><div class="timeline-title"><span>스킬 타임라인 — 사이클별 사용 횟수/순서는 덱마다 다를 수 있음</span>' + clearTimesBtn + tlFontAdjustHtml + '</div>' + cyclesHtml + addCycleBtn;

    var warnings = deck.warnings || [];
    if (editable || warnings.length) {
      var warnHtml = warnings.map(function (w, wi) {
        var removeBtn = editable ? '<button type="button" class="tile-remove small" data-remove-warn="' + wi + '" title="삭제">×</button>' : '';
        var dragHandle = editable ? '<button type="button" class="drag-handle" data-drag-handle="warn" title="드래그해서 순서 바꾸기">⠿</button>' : '';
        var text = editable
          ? '<span class="editable-text" contenteditable="true" data-warn-field="' + wi + '" data-placeholder="주의사항 입력">' + esc(w) + '</span>'
          : esc(w);
        return '<div class="warn-item"' + (editable ? ' data-drag-warn="' + wi + '"' : '') + '>※ ' + text + removeBtn + dragHandle + '</div>';
      }).join('');
      var addWarnBtn = editable ? '<button type="button" class="add-btn small" data-add-warn>+ 주의사항 추가</button>' : '';
      var warnFontAdjustHtml = state.isAdmin ? '<div class="timeline-title" style="margin:0 0 6px">' + fontAdjustControlHtml_('warn', '주의사항 글씨 크기') + '</div>' : '';
      timelineHtml += '<div class="warn-list">' + warnFontAdjustHtml + warnHtml + addWarnBtn + '</div>';
    }
    timelineHtml += '</div>';
  }

  // 그룹(요일/성문 등)이 있는 덱은 제목을 "그룹 표시명 + 순번"으로 자동으로 만들어서 쓴다.
  // (그룹 드롭다운에서 이미 뭘 고를지 정하고 순서도 정하니, 제목을 따로 손으로 적을 필요가 없어졌다.)
  // deck.title에도 그대로 반영해둬서 저장 시 서버 쪽 title 칼럼도 최신 상태로 유지된다.
  var isGrouped = !!deckGroup_(deck);
  if (isGrouped) deck.title = deckPositionLabel_(deck);

  // 그룹이 있는 덱은 관리자 모드에서 "순서" 드롭다운으로 같은 그룹 안 순서를 바꿀 수 있다.
  var orderSelectHtml = '';
  if (editable && isGrouped) {
    var siblings = decksInGroupSorted_(deckCategory_(deck), deckGroup_(deck));
    var curPos = siblings.findIndex(function (d) { return d.id === deck.id; }) + 1;
    var optHtml = siblings.map(function (d, i) {
      return '<option value="' + (i + 1) + '"' + (i + 1 === curPos ? ' selected' : '') + '>' + (i + 1) + '번째</option>';
    }).join('');
    orderSelectHtml = '<div class="order-assign">이 그룹 안에서 순서: <select onchange="reorderDeck_(Number(this.value))">' + optHtml + '</select></div>';
  }

  // deck.bossIcon을 직접 지정해둔 덱은 그걸 쓰고, 없으면 요일/그룹에 맞는 기본 보스 이미지를 자동으로 쓴다.
  var effectiveBossIcon = deck.bossIcon || defaultBossIcon_(deck);
  var bossImg = '<img src="' + esc(effectiveBossIcon) + '" referrerpolicy="no-referrer" loading="lazy" onerror="imgRetry_(this)">';
